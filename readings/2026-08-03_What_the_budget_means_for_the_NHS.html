days of filming, sleepless nights and disagreements with production - working conditions the public is learning more about as some reality cast members have called to unionize in order to demand change.",chinese:"此外，还有凌晨 4 点的叫醒电话、漫长的拍摄日程、彻夜难眠的夜晚，以及与节目组的各种分歧——随着部分真人秀演员呼吁成立工会以争取权益改善，公众也逐渐了解到了这些真实的工作环境。"},{id:"p13",english:`Ali Khan first appeared on the Food Network as a gregarious challenger on Grill It! with Bobby Flay in 2008. "I thought when I did the show someone would find another spot for me," said Khan, who has worked in TV development for Alton Brown and Jeff Mauro. "It doesn't work that way you really have to push your way in and there's lots of highs and lows."`,chinese:'阿里·汗（Ali Khan）于 2008 年首次亮相美食频道，在《与鲍比·弗雷一起开烤！》（Grill It! with Bobby Flay）中扮演一位性格开朗的挑战者。"我原本以为录完节目后会有人为我安排其他机会，"曾为阿尔顿·布朗（Alton Brown）和杰夫·莫罗（Jeff Mauro）从事电视开发工作的汗回忆道，"但事情根本不是那样运作的，你必须全靠自己硬闯，过程充满了起起落落。"'},{id:"p14",english:"After his episode aired, Khan kept busy creating his own video content, blogging about food, working as a restaurant researcher on the reality series and taking meetings with TV executives. It would take him about six years from first appearing as a cooking competitor to filming his own pilot hosting the Cooking Channel, which ran for five seasons.",chinese:"节目播出后，汗一直忙于创作自己的视频内容、撰写美食博客、在真人秀中担任餐厅调研员，并积极与电视高管见面。从最初作为烹饪选手参赛，到为烹饪频道（Cooking Channel）拍摄并主持自己的试播节目，他花了大约六年时间；该节目最终成功播出了五季。"},{id:"p15",english:`The TV personality said that hit shows, which have a built-in audience that's loyal and dedicated, can certainly help contestants in their offscreen careers thanks to the shows' reach. "It just airs and airs and airs," he said. "Food TV has made people who probably wouldn't have had a huge career have a monstrous career."`,chinese:'这位电视名人表示，热播节目拥有忠诚且专一的固定受众群，凭借巨大的传播覆盖面，确实能在荧幕之外推动参赛者的事业发展。"这些节目就是一遍又一遍、无休止地重播，"他说道，"美食电视节目确实能让那些本不可能取得大成就的人，收获极其瞩目的庞大事业。"'}],vocabulary:[{word:"high-stakes",variants:["high-stakes"],phonetic:"/ˌhaɪ ˈsteɪks/",partOfSpeech:"adj.",definition:"involving a lot of risk and serious consequences",chinese:"高风险的",example:"TV cooking competitions are often thought of as a high-stakes, life-changing experience.",exampleChinese:"电视烹饪比赛常被看作是一项高风险、能改变人生的经历。"},{word:"notoriously",variants:["notoriously"],phonetic:"/nəʊˈtɔːriəsli/",partOfSpeech:"adv.",definition:"famous for something bad",chinese:"众所周知地（含贬义），出了名地",example:"Much of their success in the notoriously competitive food world is the result of their own hard work.",exampleChinese:"他们在出了名竞争残酷的美食界的成功，更多是靠自己的努力。"},{word:"fickle",variants:["fickle"],phonetic:"/ˈfɪkl/",partOfSpeech:"adj.",definition:"changing often and unpredictably",chinese:"变幻莫测的，反复无常的",example:"The food world is notoriously competitive and fickle.",exampleChinese:"美食界出了名的竞争残酷、变幻莫测。"},{word:"capitalize",variants:["capitalize","capitalizes","capitalized","capitalizing"],phonetic:"/ˈkæpɪtəlaɪz/",partOfSpeech:"v.",definition:"to use a situation to gain an advantage (capitalize on)",chinese:"利用（机会），从中获益",example:"I probably could have done a better job capitalizing on my wins.",exampleChinese:"我本可以更好地利用那些胜利带来的红利。"},{word:"culinary",variants:["culinary"],phonetic:"/ˈkʌlɪnəri/",partOfSpeech:"adj.",definition:"relating to cooking",chinese:"烹饪的，厨艺的",example:"Not long after finishing culinary school, she faced off against three more experienced chefs.",exampleChinese:"刚从烹饪学校毕业不久，她便与三位更有经验的厨师同台竞技。"},{word:"victorious",variants:["victorious"],phonetic:"/vɪkˈtɔːriəs/",partOfSpeech:"adj.",definition:"having won a victory",chinese:"获胜的，胜利的",example:"She was then victorious in Beat Bobby Flay in 2014.",exampleChinese:"2014 年她在《击败鲍比·弗雷》中再度获胜。"},{word:"amass",variants:["amass","amasses","amassed"],phonetic:"/əˈmæs/",partOfSpeech:"v.",definition:"to collect a large amount of something over time",chinese:"积累，积聚",example:"The telegenic chef has amassed more than 20,000 followers on Instagram.",exampleChinese:"这位上镜的主厨已在 Instagram 上积累了超过 2 万名粉丝。"},{word:"aspiring",variants:["aspiring"],phonetic:"/əˈspaɪərɪŋ/",partOfSpeech:"adj.",definition:"wanting to be successful in a particular field",chinese:"有抱负的，有志从事……的",example:"When aspiring chef-testants approach Patel for advice, she reminds them of the truth.",exampleChinese:"当有志参赛的厨师向帕特尔讨教时，她会提醒他们真相。"},{word:"savvy",variants:["savvy"],phonetic:"/ˈsævi/",partOfSpeech:"adj.",definition:"practical knowledge and understanding",chinese:"精明的，有见识的",example:"Being really savvy about why you go on is really important.",exampleChinese:"清楚地知道自己参赛的目的至关重要。"},{word:"exposure",variants:["exposure"],phonetic:"/ɪkˈspəʊʒə(r)/",partOfSpeech:"n.",definition:"the attention someone gets from media or the public",chinese:"曝光度，公众关注",example:"Be mindful about cultivating your brand with the exposure.",exampleChinese:"要敏锐地借助曝光度来塑造个人品牌。"},{word:"amplify",variants:["amplify","amplifies","amplified"],phonetic:"/ˈæmplɪfaɪ/",partOfSpeech:"v.",definition:"to increase or make something stronger",chinese:"放大，增强",example:"TV can only help in amplifying a story you have.",exampleChinese:"电视只能帮你放大你已有的故事。"},{word:"dispel",variants:["dispel","dispels","dispelled"],phonetic:"/dɪˈspel/",partOfSpeech:"v.",definition:"to make doubts or beliefs disappear",chinese:"驱散，消除（疑虑/幻想）",example:"Former competitors are quick to dispel myths about their appearances.",exampleChinese:"前参赛者们纷纷打破公众对亮相节目的幻想。"},{word:"royalty",variants:["royalty","royalties"],phonetic:"/ˈrɔɪəlti/",partOfSpeech:"n.",definition:"money paid to someone whose work is broadcast or sold",chinese:"版税，使用费",example:"They don't receive royalty payments even though series are often in reruns.",exampleChinese:"即使节目被反复重播，他们也拿不到版税。"},{word:"gregarious",variants:["gregarious"],phonetic:"/ɡrɪˈɡeəriəs/",partOfSpeech:"adj.",definition:"friendly and enjoying being with other people",chinese:"爱交际的，合群的",example:"Ali Khan first appeared as a gregarious challenger on Grill It! in 2008.",exampleChinese:"阿里·汗 2008 年首次亮相时是一位开朗的挑战者。"},{word:"monstrous",variants:["monstrous"],phonetic:"/ˈmɒnstrəs/",partOfSpeech:"adj.",definition:"very large, huge (informal)",chinese:"巨大的，庞大的",example:"Food TV has made people who wouldn't have had a huge career have a monstrous career.",exampleChinese:"美食电视让本不可能有大成就的人收获了庞大事业。"}],phrases:[{phrase:"capitalize on",chinese:"利用，从……中获利",example:"I probably could have done a better job capitalizing on my wins."},{phrase:"face off against",chinese:"与……正面交锋，对决",example:"She faced off against three more experienced chefs to win an episode of Chopped."},{phrase:"when it comes to",chinese:"当涉及……时，就……而言",example:"Her TV résumé helped when it came to pursuing other projects."},{phrase:"dispel myths",chinese:"打破/驱散迷思",example:"Former cooking competitors are quick to dispel myths about their appearances."},{phrase:"push one's way in",chinese:"靠自己硬闯进去",example:"You really have to push your way in and there's lots of highs and lows."},{phrase:"highs and lows",chinese:"起起落落，高峰与低谷",example:"There's lots of highs and lows in this career."}],grammarNotes:[{sentence:"While television cooking competitions are often thought of as a high-stakes, life-changing experience that can make your career, they often don't, and contestants say that much of the industry success they've had in the notoriously competitive and fickle food world is the result of their own hustling and hard work.",explanation:"While 引导让步状语从句（虽然……），从句内 that can make your career 为定语从句修饰 experience。主句由 and 连接两个并列分句：they often don't（省略了 make your career）与 contestants say that...。say 后为 that 宾语从句，从句主干为 much of the industry success is the result of...，其中 they've had... 为省略关系词的定语从句修饰 success。"},{sentence:"Tasha Oren, director of film and media studies at Tufts University and author of the new book Food TV, which examines how culinary culture became part of pop culture, said that television appearances can strengthen a professional chef's branding and public relations, but that the experience is often different for non-professional chefs who may be expecting to find an industry career after being on the small screen.",explanation:"主干为 Tasha Oren said that... but that...。主语后接两个并列同位语（director... and author...）说明身份；which examines... 为非限定性定语从句修饰 Food TV。谓语 said 后接两个并列的 that 宾语从句（can strengthen... but that the experience is often different...）；第二个从句中 who may be expecting... 为定语从句修饰 non-professional chefs，after being on the small screen 为介词+动名词作时间状语。"},{sentence:"The TV personality said that hit shows, which have a built-in audience that's loyal and dedicated, can certainly help contestants in their offscreen careers thanks to the shows' reach.",explanation:"主干为 The TV personality said that...。that 宾语从句主干为 hit shows can help contestants；which have a built-in audience 为非限定性定语从句修饰 hit shows，其中 that's loyal and dedicated 为定语从句修饰 audience；thanks to the shows' reach 为介词短语作原因状语。"}],quiz:[{question:"What did Palak Patel mean by saying her wins were 'a story of grit rather than one of overnight stardom'?",options:["Winning the competitions immediately made her famous","Her success came from persistence and hard work, not instant fame","She won because she had 17 agents supporting her","TV competitions made her career with no extra effort"],correctAnswer:1,explanation:"P1、P5 表明：胜利并未立刻改变生活，参赛者认为成功主要靠自己的拼搏（hustling and hard work），电视竞赛履历是坚韧的故事而非一夜成名。B 正确；A、C、D 与原文相反。"},{question:"According to Tasha Oren, what can TV do for a chef?",options:["It can turn anyone into a great cook","It can amplify a story the chef already has, but cannot improve their skill","It guarantees an industry career for non-professional chefs","It replaces the need for branding and public relations"],correctAnswer:1,explanation:"P10 奥伦原话：TV can only help in amplifying a story you have, it can't help amplify your skill，即电视只能放大已有故事、无法提升技能。故选 B；其余选项均与原文不符。"},{question:"What is the main idea of the article?",options:["TV cooking competitions offer guaranteed success and high pay","Winning a cooking show rarely translates into automatic industry success; contestants must hustle and build their own brands","Only professional chefs should appear on cooking shows","Reality TV pays contestants generously in royalties"],correctAnswer:1,explanation:"全文通过帕特尔、奥伦和汗的经历论证：赢得比赛不等于行业成功，参赛者需自己拼搏、经营品牌，且报酬极低（P1、P7-8、P11-13）。B 概括了主旨；A、D 与原文相反，C 未提及。"}]},Jp={id:"2026-08-07",date:"2026-08-07",title:"Blind, slow and 500 years old – or are they? How scientists are unravelling the secrets of Greenland sharks",difficulty:"考研英语一 (The Guardian)",wordCount:820,topic:"Nature and Science",summary:"Scientists are overturning long-held beliefs about Greenland sharks: they are not blind, may not live 500 years, and are far more capable predators than their sluggish reputation suggests.",paragraphs:[{id:"p1",english:"It looks more like a worn sock than a fearsome predator. It moves slower than an escalator. By most accounts, it is a clumsy and near-sightless relic drifting in the twilight waters of the Arctic, lazily searching for food scraps.",chinese:'它看起来更像一只破旧的袜子，而不是令人胆寒的顶尖掠食者。它的移动速度甚至比自动扶梯还要缓慢。在大多数人眼中，它不过是一个笨拙且近乎失明的"活化石"，漫无目的地漂浮在冰冷微光的北极海域，懒散地搜寻着食物残渣。'},{id:"p2",english:`The Greenland shark, an animal one researcher (lovingly) said, "looks like it's already dead", is also one of the least understood, biologically enigmatic species on the planet.`,chinese:'格陵兰睡鲨（Greenland shark）被一位研究人员（带着爱意地）戏称为"看起来就像已经死透了一样"；同时，它也是这个星球上最不为人所知、最神秘莫测的物种之一。'},{id:"p3",english:"However, this month, scientists made a groundbreaking discovery: the sharks are not, in fact, blind. The newly published findings upend commonly held beliefs and expose the challenges of studying a shark that has long resisted the reaches of science.",chinese:"然而，就在本月，科学家们取得了一项突破性发现：这种鲨鱼实际上并非瞎子。这一最新发表的研究成果推翻了长久以来的固有认知，同时也揭示了研究这种长期避开科学探索视野的鲨鱼有多么艰难。"},{id:"p4",english:`"Greenland sharks represent absolute mystery," says Jena Edwards, a Canadian marine ecologist. "Even the things that we think we know, we're still a little bit unsure about. Everything about them is a question mark."`,chinese:'"格陵兰睡鲨代表着绝对的未知，"加拿大海洋生态学家杰娜·爱德华兹（Jena Edwards）表示，"即便是我们自认为有所了解的事情，也依然不敢百分之百确定。关于它们的一切都是一个未解的问号。"'},{id:"p5",english:"For decades, frustratingly little has been known about the shark, a mottled, baguette-shaped creature that reaches 20ft in length. Their sedate pace is undercut by the remains of caribou, polar bear, moose, narwhal and beluga found in their stomachs - and not all the prey is believed to be from scavenging.",chinese:"几十年来，人们对这种体长可达 20 英尺（约 6 米）、身上长有斑纹且形如法棍面包的鲨鱼知之甚少，令人大感挫败。人们原本以为它们生性迟钝沉稳，但在其胃中发现的驯鹿、北极熊、驼鹿、独角鲸和白鲸的残骸打破了这一刻板印象——而且科学家认为，并非所有这些猎物都是它们捡食腐肉得来的。"},{id:"p6",english:"Researchers have long held two key beliefs: they are the oldest living vertebrates and they are functionally blind. Both have long made sense, given that sharks are most commonly found in the cold Arctic waters, where light is minimal.",chinese:"长期以来，研究人员一直秉持两大核心观点：它们是现存最长寿的脊椎动物，并且在功能上近乎失明。考虑到这些鲨鱼大多生活在极度缺乏光线的冰冷北极海域，这两点长期以来似乎都完全合乎常理。"},{id:"p7",english:"But in early January, researchers found that the retinas appear structurally pristine and were capable of detecting light and contrast. While most Greenland sharks' eyes are cloudy and have worm-like parasitic copepods dangling from the cornea, extensive study showed they successfully withstood a sustained assault by parasites and harsh Arctic conditions.",chinese:"但在 1 月初，研究人员发现它们的视网膜结构完好如初，并且具备感知光线和对比度的能力。尽管大多数格陵兰睡鲨的眼睛混浊不清，角膜上还挂着蠕虫状的寄生桡足类动物，但深入研究表明，它们的视觉系统成功经受住了寄生虫的持续侵袭以及北极严酷环境的考验。"},{id:"p8",english:`For Nigel Hussey, one of the world's leading Greenland shark experts, the results aligned with his own experiences on the ocean floor and confirmed his belief they are "absolutely incredible animals" that, on nearly every occasion, "we vastly underestimate".`,chinese:'对于全球顶尖的格陵兰睡鲨专家之一奈杰尔·赫西（Nigel Hussey）而言，这一研究结果与他在海底的切身体验不谋而合，也印证了他的信念——它们是"绝对令人不可思议的奇特生物"，而且几乎在所有层面上，"我们都大大低估了它们"。'},{id:"p9",english:"Five years ago in a submersible off the coast of Svalbard, Norway, he observed Greenland sharks diving almost vertically between the surface and the sea floor, displaying a far greater range of movement than previously thought.",chinese:"五年前，在挪威斯瓦尔巴群岛海岸附近的一艘潜水器中，他曾观察到格陵兰睡鲨在海面与海底之间近乎垂直地潜游，展现出了远超人们先前想象的活动能力。"},{id:"p10",english:`"Studying Greenland sharks is like finding a handful of puzzle pieces, but then realising it's a thousand-piece puzzle," says doctoral student Eric Ste Marie. "We're trying to kind of come to a complete picture of this animal, using only a small snapshot of their lives."`,chinese:'"研究格陵兰睡鲨就像是抓到了几块拼图碎片，随后却发现这是一幅拥有千块碎片的巨幅拼图，"博士生埃里克·斯特·玛丽（Eric Ste Marie）说道，"我们正试图仅凭它们漫长生命中的一小段剪影，拼凑出这种动物的完整全貌。"'},{id:"p11",english:"The trip has caused Hussey to question many of the commonly held beliefs about the shark - including the idea they can live as long as 500 years.",chinese:"那次考察让赫西开始怀疑许多关于这种鲨鱼的传统观念——包括它们可以活到 500 岁的说法。"},{id:"p12",english:`A widely cited study in 2016 used carbon dating to estimate the upper level of Greenland shark longevity. By the researchers' estimates, some of the sharks in the ocean could have overlapped comfortably with William Shakespeare. But Hussey says the specific carbon-dating methodology "puts you in the ballpark" when looking at dates of tens of thousands of years. But he cautions that the method has margins of error for shorter time frames.`,chinese:'2016 年一项被广泛引用的研究利用碳测年技术推估了格陵兰睡鲨的寿命上限。根据当时研究人员的估计，海洋中的某些格陵兰睡鲨甚至可能与威廉·莎士比亚生活在同一个时代。但赫西指出，这种具体的碳测年方法在针对数万年的时间尺度时能提供"大致范围"，但在针对几百年的较短时间跨度时，其误差范围不容忽视。'},{id:"p13",english:'"This type of dating method is challenging to use for ageing animals that are hundreds of years old," he says.',chinese:'"要用这种测年方法来推算只有几百年寿命的动物的年龄，确实面临着很大挑战，"他说道。'},{id:"p14",english:"Even the name Greenland shark serves as a misnomer. Despite the common belief that they exist only in the deep, the frigid temperatures of high northern latitudes means the creatures often appear in shallow water.",chinese:'甚至连"格陵兰鲨"（Greenland shark）这个名称本身也带有某种误导性。尽管人们普遍认为它们只生活在深海，但北半球高纬度地区的严寒水温使得这些生物经常会在浅水区现身。'},{id:"p15",english:"Headlines of the shark turning up in Caribbean waters doesn't necessarily mean they are lost - but instead reflect the species are probably global circumnavigators, often existing at depths far below commercial fisheries.",chinese:"关于这种鲨鱼出现在加勒比海域的新闻头条，并不一定意味着它们迷路了——反而说明该物种可能是穿行全球海洋的远航者，常年栖息在商业捕捞线之下的无光深海。"},{id:"p16",english:"The profound and disorienting unknowns surrounding the shark are amplified by the uncertainties of a changing Arctic. The resource-rich region is warming at a rate faster than anywhere else on Earth.",chinese:"北极环境变迁带来的巨大不确定性，更加剧了围绕这种鲨鱼的重重谜团。这片资源丰富的极地地区的变暖速度比地球上其他任何地方都要快。"},{id:"p17",english:`"They're a generalist species that can eat anything. They'll survive, even if the whole food web shifts and they have to feed on completely different things," says Hussey.`,chinese:'"它们是一种适应力极强的广食性物种，什么都吃。即便整个食物网发生巨变，迫使它们改吃完全不同的食物，它们也能顽强生存下去，"赫西表示。'},{id:"p18",english:"Instead, Hussey is concerned about how little is known about Greenland shark reproduction. The last pregnant female was documented in 1950 and over 75 years later scientists still have no idea where the sharks reproduce, nor do they know how many pups are in a litter.",chinese:"相反，让赫西担忧的是人们对格陵兰睡鲨繁殖方式的知之甚少。人类上一次记录到怀孕的雌性格陵兰睡鲨还是在 1950 年；75 多年过去了，科学家们至今依然不知道它们究竟在哪里繁衍后代，也不知道它们一胎能产下多少只幼崽。"},{id:"p19",english:"The sharks also serve as a cautionary tale against hubris and underscore the knowledge gaps that persist.",chinese:"格陵兰睡鲨也是警示人类切勿自大傲慢的一面镜子，凸显了我们在自然认知上依然存在的巨大空白。"},{id:"p20",english:`"We get blinded by the stereotype. I think they're tricky, I think they're sharp and suspect they're actually very capable predators," says Hussey.`,chinese:'"我们被固有刻板印象蒙蔽了双眼。我认为它们非常狡黠、机敏，甚至怀疑它们实际上是能力极强的捕食者，"赫西说道。'},{id:"p21",english:"He and Ste Marie point to oral history of Inuit hunters that the sharks have been seen making predatory attacks in shallow waters.",chinese:"他和斯特·玛丽还引用了因纽特猎人的口头历史记录，指出曾有人亲眼目睹这种鲨鱼在浅水区发动猛烈的捕食攻击。"},{id:"p22",english:`"If all they can do is scavenge, how the hell have they managed to live on this planet for so long? And I think it's only a matter of time before we learn, once more, just how profoundly we've underestimated them."`,chinese:'"如果它们只会捡食腐肉，究竟是靠什么在这个星球上安然存活了这么久？我认为再给科学一点时间，我们终将再次发现，我们对它们的低估到底有多深。"'}],vocabulary:[{word:"fearsome",variants:["fearsome"],phonetic:"/ˈfɪəsəm/",partOfSpeech:"adj.",definition:"frightening, especially in appearance",chinese:"可怕的，令人畏惧的",example:"It looks more like a worn sock than a fearsome predator.",exampleChinese:"它看起来更像一只破旧的袜子，而不是令人胆寒的掠食者。"},{word:"predator",variants:["predator","predators"],phonetic:"/ˈpredətə(r)/",partOfSpeech:"n.",definition:"an animal that hunts and kills other animals for food",chinese:"捕食者，掠食者",example:"Hussey suspects they are actually very capable predators.",exampleChinese:"赫西怀疑它们实际上是能力极强的捕食者。"},{word:"clumsy",variants:["clumsy"],phonetic:"/ˈklʌmzi/",partOfSpeech:"adj.",definition:"awkward in movement; not graceful",chinese:"笨拙的",example:"By most accounts, it is a clumsy and near-sightless relic.",exampleChinese:"在大多数人眼中，它不过是一个笨拙且近乎失明的活化石。"},{word:"enigmatic",variants:["enigmatic"],phonetic:"/ˌenɪɡˈmætɪk/",partOfSpeech:"adj.",definition:"mysterious and difficult to understand",chinese:"神秘莫测的，难以捉摸的",example:"It is one of the least understood, biologically enigmatic species on the planet.",exampleChinese:"它是这个星球上最不为人所知、最神秘莫测的物种之一。"},{word:"groundbreaking",variants:["groundbreaking"],phonetic:"/ˈɡraʊndbreɪkɪŋ/",partOfSpeech:"adj.",definition:"introducing new and important ideas",chinese:"突破性的，开创性的",example:"Scientists made a groundbreaking discovery: the sharks are not, in fact, blind.",exampleChinese:"科学家们取得了一项突破性发现：这种鲨鱼实际上并非瞎子。"},{word:"upend",variants:["upend","upends","upended"],phonetic:"/ʌpˈend/",partOfSpeech:"v.",definition:"to turn upside down; to overturn an idea",chinese:"推翻，颠覆",example:"The newly published findings upend commonly held beliefs.",exampleChinese:"最新发表的研究成果推翻了长久以来的固有认知。"},{word:"mottled",variants:["mottled"],phonetic:"/ˈmɒtld/",partOfSpeech:"adj.",definition:"marked with spots or patches of different colors",chinese:"有斑纹的，杂色的",example:"Little has been known about the mottled, baguette-shaped creature that reaches 20ft in length.",exampleChinese:"人们对这种体长可达 20 英尺、长有斑纹且形如法棍的鲨鱼知之甚少。"},{word:"sedate",variants:["sedate"],phonetic:"/sɪˈdeɪt/",partOfSpeech:"adj.",definition:"calm and slow, not easily excited",chinese:"沉稳的，慢条斯理的",example:"Their sedate pace is undercut by the remains of large prey in their stomachs.",exampleChinese:"它们胃中大型猎物的残骸打破了其行动迟缓的刻板印象。"},{word:"scavenge",variants:["scavenge","scavenges","scavenged","scavenging"],phonetic:"/ˈskævɪndʒ/",partOfSpeech:"v.",definition:"to search for and eat dead animals",chinese:"捡食腐肉，以腐肉为食",example:"Not all the prey is believed to be from scavenging.",exampleChinese:"科学家认为并非所有猎物都是它们捡食腐肉得来的。"},{word:"vertebrate",variants:["vertebrate","vertebrates"],phonetic:"/ˈvɜːtɪbrət/",partOfSpeech:"n.",definition:"an animal with a backbone",chinese:"脊椎动物",example:"They are believed to be the oldest living vertebrates.",exampleChinese:"它们被认为是现存最长寿的脊椎动物。"},{word:"pristine",variants:["pristine"],phonetic:"/ˈprɪstiːn/",partOfSpeech:"adj.",definition:"in perfect, original condition",chinese:"完好如初的，原始状态的",example:"Researchers found that the retinas appear structurally pristine.",exampleChinese:"研究人员发现它们的视网膜结构完好如初。"},{word:"withstand",variants:["withstand","withstands","withstood"],phonetic:"/wɪðˈstænd/",partOfSpeech:"v.",definition:"to resist or survive something",chinese:"经受住，承受",example:"Their eyes successfully withstood a sustained assault by parasites.",exampleChinese:"它们的眼睛成功经受住了寄生虫的持续侵袭。"},{word:"misnomer",variants:["misnomer"],phonetic:"/ˌmɪsˈnəʊmə(r)/",partOfSpeech:"n.",definition:"a name that is wrong or misleading",chinese:"用词不当的名称，误导性名称",example:"Even the name Greenland shark serves as a misnomer.",exampleChinese:'甚至连"格陵兰鲨"这个名称本身也带有误导性。'},{word:"hubris",variants:["hubris"],phonetic:"/ˈhjuːbrɪs/",partOfSpeech:"n.",definition:"excessive pride or arrogance",chinese:"傲慢，自大",example:"The sharks serve as a cautionary tale against hubris.",exampleChinese:"格陵兰睡鲨是警示人类切勿自大傲慢的一面镜子。"},{word:"stereotype",variants:["stereotype","stereotypes"],phonetic:"/ˈsteriətaɪp/",partOfSpeech:"n.",definition:"a fixed, oversimplified idea about a group",chinese:"刻板印象",example:"We get blinded by the stereotype.",exampleChinese:"我们被固有刻板印象蒙蔽了双眼。"}],phrases:[{phrase:"by most accounts",chinese:"据大多数人所说，从各方面来看",example:"By most accounts, it is a clumsy and near-sightless relic drifting in the twilight waters."},{phrase:"undercut",chinese:"削弱，破坏（此处指打破刻板印象）",example:"Their sedate pace is undercut by the remains of caribou found in their stomachs."},{phrase:"make sense",chinese:"合乎情理，说得通",example:"Both beliefs have long made sense, given that the sharks live in waters where light is minimal."},{phrase:"a matter of time",chinese:"只是时间问题",example:"It's only a matter of time before we learn just how profoundly we've underestimated them."},{phrase:"serve as a cautionary tale",chinese:"作为警示性的事例",example:"The sharks serve as a cautionary tale against hubris."}],grammarNotes:[{sentence:`The Greenland shark, an animal one researcher (lovingly) said, "looks like it's already dead", is also one of the least understood, biologically enigmatic species on the planet.`,explanation:`主干为 The Greenland shark is also one of the... species。主语后插入同位语 an animal... 说明身份；one researcher (lovingly) said 为插入语，其后 "looks like it's already dead" 实际是省略关系词的定语从句（that looks like...）修饰 animal；like 后接表语从句 it's already dead。`},{sentence:"While most Greenland sharks' eyes are cloudy and have worm-like parasitic copepods dangling from the cornea, extensive study showed they successfully withstood a sustained assault by parasites and harsh Arctic conditions.",explanation:"While 引导让步状语从句（尽管……），从句内 and 连接两个并列谓语 are cloudy 与 have... dangling（have sth doing 结构，使动用法）；主句为 extensive study showed...，其后 they successfully withstood... 为省略 that 的宾语从句。"},{sentence:"The last pregnant female was documented in 1950 and over 75 years later scientists still have no idea where the sharks reproduce, nor do they know how many pups are in a litter.",explanation:"and 连接两个并列分句。第二分句主干为 scientists have no idea；where the sharks reproduce 为同位语从句说明 idea 的内容；nor 引起部分倒装分句（nor do they know...），其后 how many pups are in a litter 为宾语从句。"}],quiz:[{question:"According to the article, what did researchers discover in early January?",options:["Greenland sharks are completely blind","Greenland sharks' retinas can detect light and contrast","Greenland sharks live for exactly 500 years","Greenland sharks only exist in the deep sea"],correctAnswer:1,explanation:"P3、P7 指出：新研究发现睡鲨并非失明，其视网膜结构完好且能感知光线与对比度（capable of detecting light and contrast）。B 正确；A 与原文相反，C、D 是文中被质疑的旧观念。"},{question:"Why does Hussey question the 500-year lifespan claim?",options:["Carbon dating has no value for old animals","The carbon-dating method has margins of error for shorter time frames like centuries","He has direct evidence that sharks live shorter lives","The study was not widely cited by other scientists"],correctAnswer:1,explanation:"P12-13：赫西认为碳测年法用于数万年尺度能提供大致范围，但对几百年这样的较短时间跨度误差不容忽视（margins of error for shorter time frames）。B 正确；A 过度绝对，C、D 无原文依据。"},{question:"What is the main idea of the article?",options:["Greenland sharks are dangerous to humans","Scientists are overturning stereotypes about Greenland sharks and realizing how little they know","Greenland sharks will soon become extinct in the warming Arctic","Carbon dating has proved Greenland sharks lived with Shakespeare"],correctAnswer:1,explanation:'全文主线：从"眼盲、迟缓、长寿"的刻板印象出发，新研究证明其并不失明、可能是强劲捕食者，同时凸显科研认知的巨大空白（P3、P19-22）。B 概括主旨；A 无依据，C 与 P17 的适应力论证相反，D 只是 P12 的局部细节。'}]},On=[Jp,Kp,Lp,Vp,Hp,qp,Bp,Rp,Gp,Yp,Xp,Qp,Zp],Wp=({text:T,vocab:_})=>{const[O,d]=He.useState(!1),E=He.useRef(null),[D,$]=He.useState(!1);return He.useEffect(()=>{if(!O)return;if(E.current){const k=E.current.getBoundingClientRect();$(k.top<150)}const N=()=>d(!1);return window.addEventListener("click",N),()=>window.removeEventListener("click",N)},[O]),y.jsxs("span",{ref:E,className:"relative inline-block",children:[y.jsx("span",{onClick:N=>{N.stopPropagation(),d(!O)},classNam
