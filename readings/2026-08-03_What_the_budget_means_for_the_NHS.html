 */const Up=[["path",{d:"M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z",key:"uqj9uw"}],["path",{d:"M16 9a5 5 0 0 1 0 6",key:"1q6k2b"}],["path",{d:"M19.364 18.364a9 9 0 0 0 0-12.728",key:"ijwkga"}]],Cd=vt("volume-2",Up),Hp={id:"2026-07-30",date:"2026-07-30",title:"Scientists Call for Greater Emoji Biodiversity",difficulty:"考研英语一 (The Guardian)",wordCount:688,topic:"Nature and Biodiversity",summary:"Italian ecologists discover emoji representation of life is skewed toward animals while plants fungi and microorganisms are severely underrepresented.",paragraphs:[{id:"p1",english:"When Stefano Mammola and Francesco Ficetola went to an ecology conference in Prague in 2021, they met a scientist with an unusual complaint. Jennifer Anderson, an expert in aquatic fungi, lamented that the subject of her research was not available in emoji form.",chinese:"2021年，斯蒂法诺·曼莫拉（Stefano Mammola）与弗朗切斯科·菲切托拉（Francesco Ficetola）在布拉格参加一场生态学会议时，遇到了一位提出奇特抱怨的科学家。水生真菌专家詹妮弗·安德森（Jennifer Anderson）十分遗憾地表示，她的研究对象在表情符号库中竟然找不到对应的图形。"},{id:"p2",english:'"If you are doing the important work of trying to save the whale, you can use graphics to help you communicate this in a very relatable way," said Anderson, a microbial ecologist at the Swedish University of Agricultural Sciences.',chinese:`瑞典农业科学大学的微生物生态学家安德森说："如果你在从事'拯救鲸鱼'这项重要工作，你可以利用生动的图形，以一种让人极易产生共鸣的方式来进行宣讲。"`},{id:"p3",english:'"If you are working to save the aquatic fungi, you first must let people know that yes, aquatic fungi exist, then describe in words what they look like — usually not like mushrooms."',chinese:`"但如果你是在致力于拯救水生真菌，你首先得让人们知道'是的，水生真菌确实存在'，然后再用文字向他们描述它们的长相——因为它们通常长得根本不像蘑菇。"`},{id:"p4",english:'Struck by their conversation with Anderson and wary of how unusual species were ignored, Mammola and Ficetola set out with a colleague to find how well the "tree of life" was represented in the emoji library. The answer, the Italian ecologists found, was not well at all.',chinese:'这番谈话让曼莫拉和菲切托拉深受触动，同时也警示了他们：非主流物种正面临着被忽视的困境。于是，这两位意大利生态学家与一位同事展开合作，调查"生命之树"在表情符号库中的代表性如何。而最终得到的答案是：极其匮乏。'},{id:"p5",english:'"We typically have more empathy for life forms that are phylogenetically closer to us," said Mammola, an ecologist at the Water Research Institute of the National Research Council of Italy.',chinese:'意大利国家研究委员会水资源研究所的生态学家曼莫拉指出："我们往往对那些在系统发育（演化亲缘关系）上与人类更接近的生命形态抱有更多的同理心。"'},{id:"p6",english:"Emojis are a simple, colourful and direct way of communicating online. The researchers found that animals were well-represented by available emojis but plants, fungi and microorganisms were not.",chinese:"表情符号是一种简单、直观且色彩丰富的网络交流工具。研究人员发现，现有的表情符号对动物群体有着相当充分的呈现，但对植物、真菌和微生物的代表性却严重不足。"},{id:"p7",english:"In a study, the team identified emojis representing 112 distinct organisms. Among them were 92 animals, 16 plants, one toadstool-like fungus and a single micro-organism that the scientists suspect to be the gut-infecting bacteria E coli.",chinese:"在一项研究中，团队梳理出了代表 112 种不同生物的表情符号。其中包括 92 种动物、16 种植物、1 种类似毒伞菇的真菌，以及仅有的一种微生物——科学家推测其原型是引发肠道感染的大肠杆菌。"},{id:"p8",english:'"There is an impressive number of organisms, and all of them play a fundamental role for our planet, even the ones we know less about," said Mammola.',chinese:'曼莫拉表示："自然界中的物种数量庞大得令人叹为观止，而且每一种生物都在地球生态中扮演着至关重要的角色，即便那些我们鲜少了解的物种也是如此。"'},{id:"p9",english:"The researchers categorised all of the emojis related to nature and animals in Emojipedia, a curated online catalogue of emojis, and found that some big groups of creatures had no representation at all.",chinese:"研究人员对表情符号在线百科（Emojipedia）中所有与自然和动物相关的表情符号进行了归类，发现一些庞大的生物类群在其中竟然完全缺席。"},{id:"p10",english:"Arthropods made up just 16% of the animal emojis, even though there are more than 1 million described species of arthropod, compared with fewer than 100,000 described species of vertebrate.",chinese:"节肢动物仅占动物表情符号的 16%，然而已记录的节肢动物物种超过 100 万种，相比之下，已记录的脊椎动物物种还不到 10 万种。"},{id:"p11",english:"In some cases, the scientists identified individual species such as bald eagles and giant pandas, while other emojis were only identifiable to the genus or family level, such as ants and crocodiles.",chinese:'在某些情况下，科学家能精准识别出具体的物种（如白头海雕和大熊猫）；而在其他情况下，部分表情符号只能辨识到"属"或"科"的层��（如蚂蚁和鳄鱼）。'},{id:"p12",english:"The researchers said the biases in emoji representation of animal biodiversity reflected known biases in biodiversity assessments and conservation analyses, including the IUCN red list of endangered species.",chinese:"研究人员指出，表情符号在呈现生物多样性方面的偏差，恰恰映射出了现实中生物多样性评估与保护分析里普遍存在的偏见，包括《世界自然保护联盟濒危物种红色名录》（IUCN Red List）在内。"},{id:"p13",english:'Better representation could elicit interest in organisms that people do not know, said Mammola, and indirectly help conservation efforts. "Adding 20 to 30 more emojis to represent missing but pivotal organisms will be nearly costless. Such an expansion can give a better idea of how broad biodiversity is."',chinese:'曼莫拉表示，更丰富全面的物种呈现能激发公众对陌生生物的兴趣，从而间接助力生态保护工作。"额外增加 20 到 30 个表情符号来涵盖那些目前缺失但至关重要的物种，成本几乎为零。而这种扩充能让人们更直观地认识到生物多样性的广阔范畴。"'},{id:"p14",english:"Some scientists have taken steps to depict their research on their phone keyboards with images instead of words. Andrew White, a computational chemist, submitted a bid for a protein emoji last year after running a survey on X, asking structural biologists what it should look like. The selection committee, which includes representatives from tech companies including Apple, Meta and Microsoft, rejected the bid.",chinese:'一些科学家已经行动起来，试图用图标而非文字在手机键盘上展示他们的研究成果。计算化学家安德鲁·怀特（Andrew White）在社交平台 X 上发起问卷调查，询问结构生物学家蛋白质图标应该设计成什么样，随后于去年正式提交了"蛋白质表情符号"的申请提案。然而，由苹果、Meta 和微软等科技公司代表组成的 Unicode 遴选委员会驳回了该申请。'},{id:"p15",english:'"DNA is recognised as the language that encodes life, but proteins are the actual agents of life," White wrote. "I think having a protein emoji would be useful for science communication, similarly to how the DNA emoji has come to represent advances in genomics and sequencing."',chinese:'怀特写道："DNA被公认为是编码生命的语言，但蛋白质才是生命活动的真正执行者。我认为推出蛋白质表情符号对科普交流大有裨益，正如 DNA 表情符号如今已成为基因组学与基因测序技术进步的象征一样。"'},{id:"p16",english:"The Italian researchers found that emoji biodiversity was increasing. The number of animal taxa represented had risen from 45 in 2015 to 92 in 2022, the researchers found, and over time has come to better represent the diversity of creatures.",chinese:'这两位意大利研究人员也发现，表情符号的"生物多样性"确实在不断增加。他们指出，被包含在内的动物类群数量已从 2015 年的 45 个上升至 2022 年的 92 个，随着时间的推移，它正越来越好地反映出地球生物的多样性。'},{id:"p17",english:"The findings contrast sharply with the state of wildlife in the real world. A landmark review of research in 2019 found that nature was declining at rates unprecedented in human history, and that species were being wiped out faster and faster.",chinese:"然而，这一趋势与现实世界中野生动物的生存现状形成了鲜明对比。2019 年的一项里程碑式综合研究发现，大自然正以人类历史上前所未有的速度衰退，物种灭绝的步伐也在不断加快。"},{id:"p18",english:'Anderson said she wanted emojis for organisms such as aquatic fungi as reflections of increased public awareness and indicators of their ecological value. "Having an emoji signals that an organism is valued or somehow important enough to be part of daily conversation," she said.',chinese:'安德森表示，她希望看到水生真菌等生物拥有专属的表情符号，这不仅是公众认知度提升的体现，也是对其生态价值的认可。她说道："拥有表情符号意味着某种生物得到了重视，或者意味着它足够重要，能够进入人们的日常对话之中。"'}],vocabulary:[{word:"complaint",variants:["complaint","complaints"],phonetic:"/kəmˈpleɪnt/",partOfSpeech:"n.",definition:"a statement that something is wrong or unsatisfactory",chinese:"抱怨，投诉",example:"They met a scientist with an unusual complaint: the subject of her research was not available in emoji form.",exampleChinese:"他们遇到了一位提出奇特抱怨的科学家：她的研究对象在表情符号库中竟然找不到对应的图形。"},{word:"lament",variants:["lament","lamented","lamenting"],phonetic:"/ləˈment/",partOfSpeech:"v.",definition:"to express sadness or disappointment about something",chinese:"哀叹，悲叹",example:"Jennifer Anderson, an expert in aquatic fungi, lamented that the subject of her research was not available in emoji form.",exampleChinese:"水生真菌专家詹妮弗·安德森十分遗憾地表示，她的研究对象在表情符号库中竟然找不到对应的图形。"},{word:"aquatic",variants:["aquatic"],phonetic:"/əˈkwætɪk/",partOfSpeech:"adj.",definition:"living or growing in water",chinese:"水生的",example:"If you are working to save the aquatic fungi, you first must let people know that yes, aquatic fungi exist.",exampleChinese:"如果你是在致力于拯救水生真菌，你首先得让人们知道'是的，水生真菌确实存在'。"},{word:"empathy",variants:["empathy"],phonetic:"/ˈempəθi/",partOfSpeech:"n.",definition:"the ability to understand and share the feelings of another",chinese:"同理心，共情",example:"We typically have more empathy for life forms that are phylogenetically closer to us.",exampleChinese:"我们往往对那些在系统发育上与人类更接近的生命形态抱有更多的同理心。"},{word:"microorganism",variants:["microorganism","microorganisms"],phonetic:"/ˌmaɪkrəʊˈɔːɡənɪzəm/",partOfSpeech:"n.",definition:"a very small living thing that can only be seen with a microscope",chinese:"微生物",example:"Animals were well-represented by available emojis but plants, fungi and microorganisms were not.",exampleChinese:"现有的表情符号对动物群体有着相当充分的呈现，但对植物、真菌和微生物的代表性却严重不足。"},{word:"organism",variants:["organism","organisms"],phonetic:"/ˈɔːɡənɪzəm/",partOfSpeech:"n.",definition:"a living thing",chinese:"生物体，有机体",example:"The team identified emojis representing 112 distinct organisms.",exampleChinese:"团队梳理出了代表 112 种不同生物的表情符号。"},{word:"categorise",variants:["categorise","categorised","categorising"],phonetic:"/ˈkætəɡəraɪz/",partOfSpeech:"v.",definition:"to put things into groups according to type",chinese:"归类，分类",example:"The researchers categorised all of the emojis related to nature and animals in Emojipedia.",exampleChinese:"研究人员对表情符号在线百科中所有与自然和动物相关的表情符号进行了归类。"},{word:"curated",variants:["curated","curate"],phonetic:"/ˈkjʊəreɪtɪd/",partOfSpeech:"adj.",definition:"carefully selected and organized",chinese:"精心挑选的，策展的",example:"Emojipedia is a curated online catalogue of emojis.",exampleChinese:"表情符号在线百科（Emojipedia）是一个精心编纂的在线表情符号目录。"},{word:"bias",variants:["bias","biases"],phonetic:"/ˈbaɪəs/",partOfSpeech:"n.",definition:"an unfair preference for or against a thing or group",chinese:"偏见，偏差",example:"The biases in emoji representation of animal biodiversity reflected known biases in biodiversity assessments.",exampleChinese:"表情符号在呈现生物多样性方面的偏差，恰恰映射出了现实中生物多样性评估里普遍存在的偏见。"},{word:"endangered",variants:["endangered"],phonetic:"/ɪnˈdeɪndʒəd/",partOfSpeech:"adj.",definition:"at risk of becoming extinct",chinese:"濒危的",example:"The biases include the IUCN red list of endangered species.",exampleChinese:"这些偏见也包括《世界自然保护联盟濒危物种红色名录》。"},{word:"elicit",variants:["elicit","elicits","elicited"],phonetic:"/ɪˈlɪsɪt/",partOfSpeech:"v.",definition:"to get a response or information from someone",chinese:"引出，引发",example:"Better representation could elicit interest in organisms that people do not know.",exampleChinese:"更丰富全面的物种呈现能激发公众对陌生生物的兴趣。"},{word:"pivotal",variants:["pivotal"],phonetic:"/ˈpɪvətl/",partOfSpeech:"adj.",definition:"central and important",chinese:"关键的，核心的",example:"Adding 20 to 30 more emojis to represent missing but pivotal organisms will be nearly costless.",exampleChinese:"额外增加 20 到 30 个表情符号来涵盖那些目前缺失但至关重要的物种，成本几乎为零。"},{word:"depict",variants:["depict","depicts","depicted","depicting"],phonetic:"/dɪˈpɪkt/",partOfSpeech:"v.",definition:"to show or represent something in a picture or description",chinese:"描绘，表现",example:"Some scientists have taken steps to depict their research on their phone keyboards with images instead of words.",exampleChinese:"一些科学家已经行动起来，试图用图标而非文字在手机键盘上展示他们的研究成果。"},{word:"taxa",variants:["taxa"],phonetic:"/ˈtæksə/",partOfSpeech:"n.",definition:"groups of living things used in scientific classification (plural of taxon)",chinese:"分类单元（taxon 的复数）",example:"The number of animal taxa represented had risen from 45 in 2015 to 92 in 2022.",exampleChinese:"被包含在内的动物类群数量已从 2015 年的 45 个上升至 2022 年的 92 个。"},{word:"unprecedented",variants:["unprecedented"],phonetic:"/ʌnˈpresɪdentɪd/",partOfSpeech:"adj.",definition:"never having happened before",chinese:"前所未有的",example:"A landmark review found that nature was declining at rates unprecedented in human history.",exampleChinese:"一项里程碑式综合研究发现，大自然正以人类历史上前所未有的速度衰退。"}],phrases:[{phrase:"set out to do sth",chinese:"着手做某事",example:"Mammola and Ficetola set out with a colleague to find how well the 'tree of life' was represented in the emoji library."},{phrase:"be wary of",chinese:"对……警惕，提防",example:"Struck by their conversation and wary of how unusual species were ignored, the two ecologists started their research."},{phrase:"make up",chinese:"占据，构成",example:"Arthropods made up just 16% of the animal emojis."},{phrase:"wipe out",chinese:"使灭绝，摧毁",example:"Species were being wiped out faster and faster."},{phrase:"submit a bid for",chinese:"为……提交申请/投标",example:"Andrew White submitted a bid for a protein emoji last year."}],grammarNotes:[{sentence:"When Stefano Mammola and Francesco Ficetola went to an ecology conference in Prague in 2021, they met a scientist with an unusual complaint.",explanation:"when 引导时间状语从句（went to an ecology conference...）；主句为 they met a scientist。with an unusual complaint 为介词短语作后置定语修饰 scientist，说明这位科学家“带着一个不寻常的抱怨”。"},{sentence:"Among them were 92 animals, 16 plants, one toadstool-like fungus and a single micro-organism that the scientists suspect to be the gut-infecting bacteria E coli.",explanation:"本句为倒装结构：介词短语 Among them 置于句首作表语，谓语 were 提前，真正的主语是后置的并列名词短语（92 animals, 16 plants, one fungus and a single micro-organism）。that the scientists suspect to be... 为定语从句修饰 micro-organism。"},{sentence:"Andrew White, a computational chemist, submitted a bid for a protein emoji last year after running a survey on X, asking structural biologists what it should look like.",explanation:"主语 Andrew White 后接同位语 a computational chemist；after running a survey on X 为“介词+动名词”作时间状语；asking structural biologists what it should look like 为现在分词短语作伴随状语，其中 what it should look like 为宾语从句（间接宾语 structural biologists + 直接宾语从句）。"}],quiz:[{question:"What did Jennifer Anderson complain about at the ecology conference?",options:["Emojis were too colourful to use in academic communication","The subject of her research — aquatic fungi — had no corresponding emoji","Scientists rarely used emojis in their research papers","The IUCN red list ignored aquatic fungi"],correctAnswer:1,explanation:"P1 指出她 lamented that the subject of her research was not available in emoji form，即水生真菌没有对应表情符号，故选 B。其余选项文中未提及。"},{question:"What do the researchers' findings about emoji biodiversity mainly reflect?",options:["The rapid development of emoji design technology","The biases that also exist in real-world biodiversity assessments","The declining popularity of social media platforms","The increasing number of micro-organisms in nature"],correctAnswer:1,explanation:"P12 明确：表情符号呈现生物多样性的偏差 reflected known biases in biodiversity assessments and conservation analyses，即映射现实中评估与保护的既有偏见，故选 B。"},{question:"What is the main purpose of the article?",options:["To criticize tech companies for rejecting protein emoji","To introduce the history of the Unicode selection committee","To call for better emoji representation of underrepresented organisms","To compare animals and plants in the emoji library"],correctAnswer:2,explanation:"全文核心是科学家呼吁提升表情符号对生物（尤其是植物、真菌、微生物）的多样性呈现，以提升公众认知、助力保护。A 只是局部例子，B 未展开，D 仅为现象描述。"}]},qp={id:"2026-07-29",date:"2026-07-29",title:"How Super Roofs Reward Insurers Cat Bond Investors and Homeowners",difficulty:"考研英语一 (Bloomberg)",wordCount:750,topic:"Economics and Climate Resilience",summary:"North Carolina issued a 600 million catastrophe bond that rewards homeowners and insurers for installing hurricane-resistant super roofs.",paragraphs:[{id:"p1",english:`As the government stalls federal funding for projects intended to make states more resilient to climate change and private insurers decline to cover properties in high-risk zones, North Carolina just proved there's another way to fund disaster preparedness: a $600 million catastrophe bond that rewards homeowners and their insurer for installing "super roofs."`,chinese:'在联邦政府暂缓拨款资助提升各州气候韧性的项目、且私人保险公司纷纷拒绝承保高风险地区房产之际，北卡罗来纳州刚刚证明了筹集备灾资金的另一种可能：发行一笔 6 亿美元的巨灾债券（catastrophe bond），用以奖励安装"超级屋顶"的业主及其保险公司。'},{id:"p2",english:"Along North Carolina's beaches, wind damage from hurricanes is such a threat that many private insurers have stopped offering coverage. Hundreds of thousands of homeowners have been forced to buy coverage from the North Carolina Insurance Underwriting Association (NCIUA), the state-created insurer of last resort for coastal properties.",chinese:"沿着北卡罗来纳州的海岸线，飓风带来的风灾威胁极其严重，导致众多私人保险公司已停止提供保险。数十万业主被迫转向北卡罗来纳州保险承保协会（NCIUA）购买保险——这是该州专门为沿海房产设立的兜底承保机构（insurer of last resort）。"},{id:"p3",english:"Like other insurers, NCIUA has to buy its own risk mitigation so it can pay customers if a major event causes more damage than it has saved from collecting and investing premiums. One option is reinsurance and another is a catastrophe bond, which pays out a specific amount if damage reaches a particularly severe level. Cat bonds have become popular with institutional investors like hedge funds and endowments in recent years because they trigger rarely and otherwise deliver high returns.",chinese:"与其他保险公司一样，NCIUA 也必须购买自身的风险分散服务（风险缓解方案），以便在重大灾害造成的损失超出其保费收入与投资积累时，仍有能力向客户赔付。其选择之一是再保险，另一种则是巨灾债券（Cat bond）——当灾害损失达到某一特定严重程度时，该债券就会触发赔付。近年来，巨灾债券深受对冲基金和捐赠基金等机构投资者的青睐，因为其触发赔付的概率极低，而在未触发时又能提供高额回报。"},{id:"p4",english:"For years, academics and brokers have discussed whether cat bonds could do more than just clean up after disasters — whether they could incentivize mitigation work that would lessen damages in the first place. Earlier this year, NCIUA decided to test it: They offered investors a cat bond with two features linked to reducing wind damage risks to homes in its portfolio.",chinese:"多年来，学者和保险经纪人一直在讨论：巨灾债券的作用能否不仅限于灾后善后，而是从源头上激励风险防范工作，从而直接减少损失？今年早些时候，NCIUA 决定对此进行尝试：他们向投资者发行的巨灾债券具备两大创新机制，直接挂钩于降低其承保组合中房屋的风灾风险。"},{id:"p5",english:"First, if no major losses occur each year, $2 million returns to NCIUA earmarked exclusively to incentivize homeowners to install super roofs that are especially wind-resistant. Second, as more people add these roofs, the annual pricing on the bond resets to reflect the changing exposure.",chinese:'首先，如果每年未发生重大损失，将有 200 万美元返还给 NCIUA，这笔资金将专款用于补贴和激励业主加装具有极强防风性能的"超级屋顶"。其次，随着加装此类屋顶的房屋越来越多，债券的年度定价将进行重新设定，以动态反映风险敞口的降低。'},{id:"p6",english:"It's modest financially but revolutionary conceptually, said Shalini Vajjhala, founder and executive director of PRE Collective, a San Diego-based nonprofit that works with communities and government agencies to clear barriers to building climate resilient infrastructure.",chinese:'"虽然从资金规模上看并不算巨额，但在理念上却是革命性的，"总部位于圣地亚哥的非营利组织 PRE Collective 创始人兼执行董事沙里尼·瓦贾哈拉（Shalini Vajjhala）表示。该机构致力于与社区和政府部门合作，扫除建设气候韧性基础设施的障碍。'},{id:"p7",english:`"The North Carolina program is game-changing," she said. "It's a precedent-setting way of linking how you manage your financial risks with how you manage physical risks."`,chinese:'"北卡罗来纳州的这一项目正在颠覆游戏规则，"她说道，"它开创了将财务风险管理与实体物理风险管理相挂钩的先河。"'},{id:"p8",english:"NCIUA officials researched options to reduce liability, landing on a seemingly simple one: roof fortification.",chinese:"NCIUA 的官员们一直在研究降低承保责任风险的方案，最终锁定了一个看似简单的突破口：屋顶加固。"},{id:"p9",english:"There was one big roadblock. Super roofs prevented damage, but since they exceed building code requirements and cost roughly $3,400 more than a standard roof, few homeowners installed them.",chinese:"但当时面临着一个巨大障碍：虽然超级屋顶能有效防灾，但由于其标准高于普通建筑规范，造价比标准屋顶贵了约 3,400 美元，因此鲜有业主愿意主动安装。"},{id:"p10",english:"About two years ago, the program began really catching on. Today, more than 20,574 homes have these roofs or are in the process of adding them and more than 6,000 were added just this year. And the financial benefits are already accruing. After every storm, NCIUA checks the results. They've found that fortified homes had 60% fewer claims than code-compliant homes during regular storms, and 20% to 30% fewer claims with lower severity during named storms.",chinese:"大约两年前，该推广计划开始真正大受欢迎。如今，已有超过 20,574 户家庭安装或正在加装这种屋顶，仅今年就新增了 6,000 多户。其经济效益也已显现：每次风暴过后，NCIUA 都会进行核查，结果发现，在常规风暴中，加固房屋的索赔量比仅符合普通建筑规范的房屋减少了 60%；而在强飓风（命名风暴）中，索赔量也减少了 20% 至 30%，且赔付严重程度明显更低。"},{id:"p11",english:"NCIUA says its financial analysis is that it will recoup $72 million over 10 years on the investment in roofs, some from avoided losses after storms but even more from having to purchase less reinsurance because its portfolio is less risky.",chinese:"NCIUA 的财务分析显示，未来 10 年内，协会将在屋顶补贴投资中收回 7,200 万美元——这部分来自风暴后避免的直接损失，而更大一部分则源于承保组合整体风险降低后，所需购买的再保险费用大幅减少。"},{id:"p12",english:"With demand for roofs finally surging, NCIUA wanted to make sure it had adequate capital for all the willing participants. It began looking beyond its own surplus to fund grants. Every year the association pays for a combination of reinsurance and cat bonds to cover portfolio risk. Cat bonds with resilience features had been discussed in academic literature, and NCIUA now wanted to make one a reality.",chinese:'随着屋顶改造需求终于迎来爆发，NCIUA 希望确保有足够的资金支持所有意向家庭。于是，协会开始在自身资金盈余之外寻找新的资助来源。该协会每年都会联合购买再保险和巨灾债券来对冲组合风险。尽管包含"防灾韧性激励"机制的巨灾债券此前仅存在于学术文献中，但 NCIUA 决心将其转化为现实。'},{id:"p13",english:"When the Cape Lookout Re bond was sold to investors in February, it not only secured an interest rate at the low end of expectations, according to Artemis, the industry trade magazine, it attracted far more interest than expected. Offered at $350 million, it instead drew $600 million in investor interest.",chinese:"据行业权威杂志《Artemis》报道，当这笔名为 Cape Lookout Re 的巨灾债券于 2 月发售时，不仅最终锁定的利率处于预期区间下限（降低了发债成本），而且吸引了远超预期的认购热情。该债券原本计划发行 3.5 亿美元，但最终认购需求高达 6 亿美元。"},{id:"p14",english:`Many working to make homes and cities more resilient to storms and wildfires worsened by climate change are hopeful the association's success will be a model. "North Carolina did the really heavy lifting, and when it's done, it opens up this whole universe of opportunities where you can basically create a plug-and-socket between programs that reduce risk and insurers who benefit," said Vajjhala.`,chinese:'许多致力于提升房屋与城市抗击气候变化（加剧的风暴与野火）能力的业内人士希望，该协会的成功经验能够成为一种示范模式。瓦贾哈拉表示："北卡罗来纳州完成了最艰难的基础性探索；而一旦攻克这一步，它就开启了一个充满无限可能的新天地——让人能够像插头与插座对接一样，将减灾方案与受益的保险公司无缝连接起来。"'},{id:"p15",english:"There are reasons to believe replicating this model for other climate threats may be challenging. A direct relationship between roofs and reduced wind damage has been established. Individual efforts by homeowners to reduce fire risk, for example, aren't as perfectly correlated because community factors like the state of nearby forests and forest breaks are also in play.",chinese:"不过，也有理由认为将这一模式复制到其他气候威胁上可能会面临挑战。例如，屋顶加固与减少风害之间存在非常明确直接的因果关系；相比之下，业主为降低野火风险所做的个人努力与最终损益则没有如此完美的正相关性，因为附近森林的状况、防火隔离带等社区层面的整体因素同样在发挥重要作用。"},{id:"p16",english:"Still, Dave Jones, a professor at the University of California at Berkeley and former California Insurance Commissioner who led a team that designed and placed the first wildfire insurance policy priced to account for local forest management including controlled burns to reduce the chance of huge blazes — argues that such bonds should interest all 35 state-backed insurance plans of last resort.",chinese:"尽管如此，加州大学伯克利分校教授、前加州保险专员戴夫·琼斯（Dave Jones）认为，此类债券应当引起全美所有 35 个州资助的兜底保险计划（plans of last resort）的关注。琼斯曾带领团队设计并推出了首个将当地森林管理（包括通过计划烧除/控制性燃烧来降低特大火灾风险）纳入定价因素的野火保险保单。"},{id:"p17",english:`"It's going to vary based on the circumstances," he said. "But I think it's worth looking at."`,chinese:'"具体情况当然会因地而异，"他表示，"但我认为这非常值得借鉴与探索。"'}],vocabulary:[{word:"resilient",variants:["resilient","resilience"],phonetic:"/rɪˈzɪliənt/",partOfSpeech:"adj.",definition:"able to recover quickly from difficult conditions",chinese:"有复原力的；适应能力强的",example:"North Carolina just proved there's another way to fund disaster preparedness: a $600 million catastrophe bond that rewards homeowners and their insurer for installing super roofs.",exampleChinese:"北卡罗来纳州刚刚证明了筹集备灾资金的另一种可能：发行一笔 6 亿美元的巨灾债券，用以奖励安装“超级屋顶”的业主及其保险公司。"},{word:"fund",variants:["fund","funding","funds","funded"],phonetic:"/fʌnd/",partOfSpeech:"v./n.",definition:"to provide money for something; a sum of money saved for a purpose",chinese:"资助，拨款；资金",example:"As the government stalls federal funding for projects intended to make states more resilient to climate change...",exampleChinese:"在联邦政府暂缓拨款资助提升各州气候韧性的项目之际……"},{word:"coverage",variants:["coverage"],phonetic:"/ˈkʌvərɪdʒ/",partOfSpeech:"n.",definition:"protection provided by an insurance policy",chinese:"承保范围，保险",example:"Wind damage from hurricanes is such a threat that many private insurers have stopped offering coverage.",exampleChinese:"飓风带来的风灾威胁极其严重，导致众多私人保险公司已停止提供保险。"},{word:"premium",variants:["premium","premiums"],phonetic:"/ˈpriːmiəm/",partOfSpeech:"n.",definition:"an amount of money paid for an insurance policy",chinese:"保险费；溢价",example:"NCIUA has to buy its own risk mitigation so it can pay customers if a major event causes more damage than it has saved from collecting and investing premiums.",exampleChinese:"NCIUA 也必须购买自身的风险分散服务，以便在重大灾害造成的损失超出其保费收入与投资积累时，仍有能力向客户赔付。"},{word:"mitigation",variants:["mitigation","mitigate"],phonetic:"/ˌmɪtɪˈɡeɪʃn/",partOfSpeech:"n.",definition:"the action of reducing the severity of something harmful",chinese:"缓解，减轻",example:"Academics and brokers have discussed whether cat bonds could incentivize mitigation work that would lessen damages in the first place.",exampleChinese:"学者和保险经纪人一直在讨论：巨灾债券能否从源头上激励风险防范工作，从而直接减少损失。"},{word:"trigger",variants:["trigger","triggers","triggered"],phonetic:"/ˈtrɪɡə(r)/",partOfSpeech:"v.",definition:"to cause something to start or happen",chinese:"触发，引发",example:"A catastrophe bond pays out a specific amount if damage reaches a particularly severe level, because they trigger rarely and otherwise deliver high returns.",exampleChinese:"当灾害损失达到某一特定严重程度时，巨灾债券就会触发赔付，因为其触发概率极低，而在未触发时又能提供高额回报。"},{word:"portfolio",variants:["portfolio"],phonetic:"/pɔːtˈfəʊliəʊ/",partOfSpeech:"n.",definition:"a set of investments or assets owned by a person or organization",chinese:"投资组合；业务组合",example:"They offered investors a cat bond with two features linked to reducing wind damage risks to homes in its portfolio.",exampleChinese:"他们向投资者发行的巨灾债券具备两大创新机制，直接挂钩于降低其承保组合中房屋的风灾风险。"},{word:"incentivize",variants:["incentivize","incentivized","incentivizing"],phonetic:"/ɪnˈsentɪvaɪz/",partOfSpeech:"v.",definition:"to make someone want to do something by offering a reward",chinese:"激励，刺激",example:"$2 million returns to NCIUA earmarked exclusively to incentivize homeowners to install super roofs.",exampleChinese:"将有 200 万美元返还给 NCIUA，这笔资金将专款用于补贴和激励业主加装超级屋顶。"},{word:"exposure",variants:["exposure"],phonetic:"/ɪkˈspəʊʒə(r)/",partOfSpeech:"n.",definition:"the amount of risk a person or business is open to",chinese:"风险敞口；暴露",example:"As more people add these roofs, the annual pricing on the bond resets to reflect the changing exposure.",exampleChinese:"随着加装此类屋顶的房屋越来越多，债券的年度定价将进行重新设定，以动态反映风险敞口的降低。"},{word:"fortification",variants:["fortification"],phonetic:"/ˌfɔːtɪfɪˈkeɪʃn/",partOfSpeech:"n.",definition:"the act of strengthening a place or structure against attack",chinese:"加固；防御工事",example:"NCIUA officials researched options to reduce liability, landing on a seemingly simple one: roof fortification.",exampleChinese:"NCIUA 的官员们一直在研究降低承保责任风险的方案，最终锁定了一个看似简单的突破口：屋顶加固。"},{word:"roadblock",variants:["roadblock"],phonetic:"/ˈrəʊdblɒk/",partOfSpeech:"n.",definition:"an obstacle that prevents progress",chinese:"障碍，拦路虎",example:"There was one big roadblock: super roofs cost roughly $3,400 more than a standard roof.",exampleChinese:"但当时面临着一个巨大障碍：超级屋顶的造价比标准屋顶贵了约 3,400 美元。"},{word:"exceed",variants:["exceed","exceeds","exceeded"],phonetic:"/ɪkˈsiːd/",partOfSpeech:"v.",definition:"to be greater than a number or amount",chinese:"超过，超出",example:"Since they exceed building code requirements and cost roughly $3,400 more, few homeowners installed them.",exampleChinese:"由于超级屋顶的标准高于普通建筑规范，造价也更贵，因此鲜有业主愿意主动安装。"},{word:"accrue",variants:["accrue","accrues","accrued","accruing"],phonetic:"/əˈkruː/",partOfSpeech:"v.",definition:"to increase gradually over time",chinese:"累积；产生（收益）",example:"The financial benefits are already accruing.",exampleChinese:"其经济效益也已开始显现。"},{word:"recoup",variants:["recoup","recoups","recouped"],phonetic:"/rɪˈkuːp/",partOfSpeech:"v.",definition:"to get back money that you have spent or lost",chinese:"收回（成本），弥补",example:"NCIUA says it will recoup $72 million over 10 years on the investment in roofs.",exampleChinese:"NCIUA 的财务分析显示，未来 10 年内，协会将在屋顶补贴投资中收回 7,200 万美元。"},{word:"replicate",variants:["replicate","replicating","replicated"],phonetic:"/ˈreplɪkeɪt/",partOfSpeech:"v.",definition:"to copy or repeat something exactly",chinese:"复制，重现",example:"There are reasons to believe replicating this model for other climate threats may be challenging.",exampleChinese:"不过，也有理由认为将这一模式复制到其他气候威胁上可能会面临挑战。"}],phrases:[{phrase:"insurer of last resort",chinese:"最后的承保人，兜底承保机构",example:"Hundreds of thousands of homeowners have been forced to buy coverage from the NCIUA, the state-created insurer of last resort for coastal properties."},{phrase:"in the first place",chinese:"首先；从一开始",example:"Academics have discussed whether cat bonds could incentivize mitigation work that would lessen damages in the first place."},{phrase:"catch on",chinese:"流行起来，受欢迎",example:"About two years ago, the program began really catching on."},{phrase:"do the heavy lifting",chinese:"承担最繁重的工作",example:"North Carolina did the really heavy lifting, and when it's done, it opens up this whole universe of opportunities."},{phrase:"in play",chinese:"在起作用，产生影响",example:"Community factors like the state of nearby forests and forest breaks are also in play."}],grammarNotes:[{sentence:"As the government stalls federal funding for projects intended to make states more resilient to climate change and private insurers decline to cover properties in high-risk zones, North Carolina just proved there's another way to fund disaster preparedness: a $600 million catastrophe bond that rewards homeowners and their insurer for installing 'super roofs.'",explanation:"主句为 North Carolina just proved...。句首 as 引导时间/原因状语从句，从句内由 and 连接两个并列分句（the government stalls... 与 private insurers decline to...）。intended to make... 为过去分词短语作后置定语修饰 projects。冒号后为 there's another way 的同位语，解释具体方式；that rewards... 为定语从句修饰 bond。"},{sentence:"First, if no major losses occur each year, $2 million returns to NCIUA earmarked exclusively to incentivize homeowners to install super roofs that are especially wind-resistant.",explanation:"if 引导条件状语从句。主句为 $2 million returns to NCIUA；earmarked exclusively to... 为过去分词短语作后置定语修饰 $2 million（= $2 million which is earmarked...）。句末 that are especially wind-resistant 为定语从句修饰 super roofs。"},{sentence:"Still, Dave Jones, a professor at the University of California at Berkeley and former California Insurance Commissioner who led a team that designed and placed the first wildfire insurance policy priced to account for local forest management including controlled burns to reduce the chance of huge blazes — argues that such bonds should interest all 35 state-backed insurance plans of last resort.",explanation:"本句主语 Dave Jones 与谓语 argues 之间插入长达数十词的同位语+定语从句，形成“主谓分隔”结构。a professor... and former California Insurance Commissioner 为同位语；who led a team 修饰 Jones，that designed and placed... 修饰 team；priced to account for... 为过去分词短语作定语修饰 policy；including controlled burns... 为现在分词作定语修饰 management。破折号后谓语 argues 才出现，后接 that 宾语从句。"}],quiz:[{question:"Why did few homeowners initially install super roofs?",options:["They were not aware of the insurance program","The roofs cost about $3,400 more and exceeded building code requirements","Private insurers refused to cover homes with such roofs","The state government failed to approve the building code"],correctAnswer:1,explanation:"P9 明确给出原因：super roofs prevented damage, but since they exceed building code requirements and cost roughly $3,400 more than a standard roof, few homeowners installed them。B 正确；A、C、D 均为无中生有。"},{question:"What does the 'plug-and-socket' analogy in Paragraph 14 suggest?",options:["Risk-reduction programs and insurers who benefit can be directly connected","Insurance companies should build facilities like plugs and sockets","Homeowners and insurers should share the cost equally","The government should provide sockets for climate projects"],correctAnswer:0,explanation:"P14 瓦贾哈拉原话：it opens up this whole universe of opportunities where you can basically create a plug-and-socket between programs that reduce risk and insurers who benefit，即把减灾方案与受益保险公司像插头插座一样无缝对接，故选 A。"},{question:"What is the main idea of the article?",options:["North Carolina proved that catastrophe bonds can link financial risk management with physical risk reduction, a model worth replicating","Hurricane damage in North Carolina is too severe for private insurers to bear","Super roofs are too expensive for most homeowners to install","Catastrophe bonds deliver high returns but rarely trigger"],correctAnswer:0,explanation:"全文主线：NCIUA 发行带减灾激励机制的巨灾债券，用 200 万美元/年奖励超级屋顶，实现财务风险与实体风险挂钩，且被业界视为可复制的范例。B、C、D 只是局部细节，不构成主旨。"}]},Bp={id:"2026-07-31",date:"2026-07-31",title:"We are All in Dark Mode Now",difficulty:"考研英语一 (The Atlantic)",wordCount:750,topic:"Technology and Society",summary:"Dark mode spread from programmer culture to mainstream as ordinary people screen habits became indistinguishable from software engineers.",paragraphs:[{id:"The sun is setting o",english:"The sun is setting on computers. In October, Google finally — finally — rolled out a new black-background view for its Calendar app. This is just the latest in a string of recent software darkenings. In July, Wikipedia went light-on-dark. And a few years before that, we got dark-theme Google Search. One by one, the bright, white backgrounds that have defined these and all computer interfaces since the advent of the Macintosh have been slipping into the shadows.",chinese:"电脑上的太阳正在落下。10 月，谷歌终于为其日历应用推出了黑底界面的新视图。这只是近期一连串软件暗黑化趋势中的最新一环。今年 7 月，维基百科上线了深色模式；而在几年前，我们迎来了深色主题的谷歌搜索。自麦金塔问世以来定义了这些软件乃至所有计算机界面的明亮白色背景，正一个接一个地退入阴影之中。"},{id:"Dark mode has its to",english:"Dark mode has its touted benefits: Dimmer screens mean less eye strain, some assert; and on certain displays (including most smartphones), showing more black pixels prolongs battery life. Dark mode also has its drawbacks: Reading lots of text is more difficult to do in white-on-black.",chinese:"深色模式有其广受推崇的好处：有人断言，调暗的屏幕能减轻眼睛疲劳；此外，在某些显示屏上，显示更多黑色像素可以延长电池续航。但深色模式也有其缺点：在黑底白字的情况下阅读大量长文本会更加费劲。"},{id:"But even if these tr",english:"But even if these tradeoffs might be used to justify the use of inverted-color settings, they offer little insight into those settings' true appeal. They don't tell us why so many people suddenly want their screens, which had glowed bright for years, to go dark.",chinese:"然而，即使这些权衡利弊可以用来解释人们为何使用反色设置，它们也未能揭示这些设置真正的吸引力所在。它们无法告诉我们，为什么突然有这么多人希望自己多年来一直发出明亮光芒的屏幕变暗。"},{id:"Computer programmers",english:"Computer programmers, for their part, have always liked the dark. In the 1990s and early 2000s, I managed a large team of software engineers.",chinese:"就计算机程序员而言，他们一直偏爱黑暗。在 20 世纪 90 年代和 2000 年代初，我曾管理过一个庞大的软件工程师团队。"},{id:"I remember one of th",english:"I remember one of them was so averse to lighting that he draped a thick blanket over his monitor and torso, creating a makeshift cave for work. Another built a lighttight cot underneath his cubicle in which to take breaks to recover from the oppressive sun that poured in through office windows. Others merely chose to work very early or very late, under the natural shroud of night.",chinese:"我记得其中一个人非常反感光线，甚至用一条厚毯子罩住显示器和自己的上半身，为自己打造了一个工作用的简易洞穴。另一个人在他办公隔间下方造了一张不透光的小床，以便在里面休息，躲避从办公室窗户倾泻而入的令人窒息的阳光。还有些人则干脆选择在清晨或深夜工作，置身于夜幕的天然掩护之下。"},{id:"Why? If I'd asked th",english:"Why? If I'd asked them, they would probably have said: to reduce distractions and improve focus. Programming a computer is a bit like repairing a very tiny machine with precision tools while looking under a microscope. Quiet and calm help facilitate that process. Programmers may also just prefer the dark.",chinese:"这是为什么呢？如果我问他们，他们大概会说：为了减少干扰，提高注意力。编写计算机程序有点像在显微镜下用精密工具修理一台微型机器，安静与平缓的环境有助于推进这一过程。当然，程序员们也可能只是单纯喜欢黑暗。"},{id:"But even with the en",english:"But even with the environment dimmed, one source of light persists: the computer itself. Its bright glare could potentially disrupt the very act of writing the programs it might run.",chinese:"但即便周围的环境变暗了，依然有一个光源挥之不去：那就是电脑本身。它发出的刺眼强光可能会干扰到编写程序这一过程本身。"},{id:"Perhaps that is why ",english:"Perhaps that is why code-editing software has long offered white-on-black displays or other dimmed-out custom color themes. If you look at depictions of programmers at work in television or film, you are likely to see white text on black screens. It's a visual sign of computer professionals at work.",chinese:"也许正因如此，代码编辑软件长期以来一直提供黑底白字或其它偏暗的自定义颜色主题。如果你看影视剧中对程序员工作场景的刻画，很可能会看到黑屏白字的界面。这已然成为计算机专业人员正在工作的视觉标志。"},{id:"Those of us old enou",english:"Those of us old enough to remember using command-line text on DOS- or Unix-based computers will recall that light-on-dark displays were, at first, the standard. To call it dark mode, as we do today, and sell it as a wellness tool is a somewhat recent innovation.",chinese:"我们当中那些资历够老、还记得在 DOS 或 Unix 计算机上使用命令行文本的人都会记得，黑底亮字的显示方式最初才是标准配置。像我们今天这样把它称为深色模式，并将其作为一种健康护眼工具来宣传，不过是近年来才出现的概念。"},{id:"Starting about 10 ye",english:"Starting about 10 years ago, the option of a dark or dimmer background began to be included as a system-wide setting on laptops and smartphones. Microsoft launched its Windows Night Light mode, with warmer colors, in 2017; Apple followed with its own Dark Mode shortly after. Once that happened, individual software applications followed suit.",chinese:"大约从 10 年前开始，深色或暗色背景选项开始作为笔记本电脑和智能手机的系统级设置被引入。微软于 2017 年推出了色温更暖的 Windows 夜间模式；不久后，苹果也随之推出了自己的深色模式。一旦这种情况发生，各个独立软件应用便纷纷效仿。"},{id:"The light-on-dark ap",english:"The light-on-dark appearance could now be marketed as a way to heal your circadian rhythms, but its essential function was the same as ever: a softer, less oppressive glow for people who might be staring at their screens for many hours at a time.",chinese:"如今，这种黑底亮字的外观可以被营销为改善昼夜节律的手段，但它的核心功能一如既往：为那些可能一次盯着屏幕好几个小时的人提供更柔和、更少压迫感的光芒。"},{id:"The number of people",english:"The number of people doing so was increasing every day. Even 20 years ago, a computer was still a tool used only occasionally. Between the early aughts and the late 2010s, the rest of humankind caught up with computer programmers. Communication now takes place on a screen. So does knowledge work. Also shopping, entertainment, and the management of daily life.",chinese:"这样做的群体每天都在增加。即使在 20 年前，电脑依然只是一种偶尔使用的工具。然而，从 21 世纪初到 2010 年代末，人类的其余群体都追上了计算机程序员的脚步。如今，沟通交流在屏幕上进行，知识型工作亦是如此，甚至连购物、娱乐和日常生活管理也都离不开屏幕。"},{id:"According to one rep",english:"According to one report, Americans checked their phones more than 200 times a day this year, an increase of 40 percent over last year. In short, an ordinary person's habits of computer use have grown to be a lot more like those of the previously strange guys who were writing software with me at the dawn of the internet.",chinese:"据一份报告显示，今年美国人每天查看手机的次数超过 200 次，比去年增加了 40%。简而言之，普通人使用电子设备的习惯，已经变得极其类似于互联网黎明时期那些和我一起写软件的古怪家伙了。"},{id:"So dark modes spread",english:"So dark modes spread to serve our changing circumstances. Every app will achieve this effect on its own. Software companies may even start competing to produce the most effective artificial night.",chinese:"因此，深色模式的普及是为了适应我们不断变化的环境与习惯。每个应用程序都在自发实现这一效果，软件公司甚至可能开始竞争制造出最有效的人造黑夜。"},{id:"It is now gotten to ",english:"It is now gotten to the point where Microsoft can engage in dark-mode ballyhoo: Its own Black theme provides the darkest experience, the company boasts; if you are in search of dark mode, this is the theme for you.",chinese:"如今，事情已经发展到微软可以对深色模式进行大肆宣传的程度：该公司吹嘘其自带的黑色主题提供了最深邃的体验——如果你正在寻找深色模式，这就是最适合你的主题。"},{id:"Maybe the dark-mode ",english:"Maybe the dark-mode age was inevitable. The bright glow of computers was tolerable even thrilling when it still felt new, but as lit-up screens suffused our every waking act, their light was doomed to overwhelm us.",chinese:"也许深色模式时代的到来是不可避免的。当电脑的刺眼光芒还让人感到新鲜时，它是可以忍受甚至令人兴奋的；但当亮起的屏幕充斥着我们清醒时的每一个举动，它们的光线注定会让人难以忍受。"},{id:"Given that software ",english:"Given that software developers are the people who develop software, and their software-making software had been in dark mode from the start, the latest trend should come as no surprise. Of course darkness would have spread from their desktops to everyone. From day into night, we are all programming computers now.",chinese:"鉴于软件开发人员是开发软件的人，而他们用来制作软件的工具从一开始就处于深色模式，这种最新趋势也就不足为奇了。黑暗自然会从他们的桌面蔓延到每个人的桌面。从白天到黑夜，我们如今其实都在给电脑编程。"}],vocabulary:[{word:"touted",variants:["touted","tout","touts","touting"],phonetic:"/taʊtɪd/",partOfSpeech:"adj.",definition:"praised or advertised in an exaggerated way",chinese:"被吹捧的，被宣传的",example:"Dark mode has its touted benefits: dimmer screens mean less eye strain, some assert.",exampleChinese:"深色模式有其广受推崇的好处：有人断言，调暗的屏幕能减轻眼睛疲劳。"},{word:"strain",variants:["strain","strains"],phonetic:"/streɪn/",partOfSpeech:"n.",definition:"pressure or tension; damage to a part of the body from overuse",chinese:"压力；劳损（此处指眼疲劳）",example:"Dimmer screens mean less eye strain, some assert.",exampleChinese:"有人断言，调暗的屏幕能减轻眼睛疲劳。"},{word:"drawback",variants:["drawback","drawbacks"],phonetic:"/ˈdrɔːbæk/",partOfSpeech:"n.",definition:"a disadvantage or problem",chinese:"缺点，弊端",example:"Dark mode also has its drawbacks: reading lots of text is more difficult in white-on-black.",exampleChinese:"但深色模式也有其缺点：在黑底白字的情况下阅读大量长文本会更加费劲。"},{word:"averse",variants:["averse"],phonetic:"/əˈvɜːs/",partOfSpeech:"adj.",definition:"strongly disliking or opposed to something",chinese:"厌恶的，反对的（be averse to）",example:"I remember one of them was so averse to lighting that he draped a thick blanket over his monitor and torso.",exampleChinese:"我记得其中一个人非常反感光线，甚至用一条厚毯子罩住显示器和自己的上半身。"},{word:"makeshift",variants:["makeshift"],phonetic:"/ˈmeɪkʃɪft/",partOfSpeech:"adj.",definition:"used temporarily because nothing better is available",chinese:"临时的，权宜的",example:"He draped a thick blanket over his monitor and torso, creating a makeshift cave for work.",exampleChinese:"他用一条厚毯子罩住显示器和自己的上半身，为自己打造了一个工作用的简易'洞穴'。"},{word:"oppressive",variants:["oppressive"],phonetic:"/əˈpresɪv/",partOfSpeech:"adj.",definition:"making you feel uncomfortable, worried or unhappy",chinese:"令人压抑的，难以忍受的",example:"Another built a lighttight cot to recover from the oppressive sun that poured in through office windows.",exampleChinese:"另一个人造了一张不透光的小床，以便躲避从办公室窗户倾泻而入的令人窒息的阳光。"},{word:"shroud",variants:["shroud","shrouds"],phonetic:"/ʃraʊd/",partOfSpeech:"n.",definition:"a thing that covers or hides something",chinese:"覆盖物，遮蔽物",example:"Others chose to work very early or very late, under the natural shroud of night.",exampleChinese:"还有些人则干脆选择在清晨或深夜工作，置身于夜幕的天然掩护之下。"},{word:"glare",variants:["glare","glares"],phonetic:"/ɡleə(r)/",partOfSpeech:"n.",definition:"a bright, unpleasant light that hurts your eyes",chinese:"刺眼的强光",example:"Its bright glare could potentially disrupt the very act of writing the programs it might run.",exampleChinese:"它发出的刺眼强光可能会干扰到编写程序这一过程本身。"},{word:"disrupt",variants:["disrupt","disrupts","disrupted"],phonetic:"/dɪsˈrʌpt/",partOfSpeech:"v.",definition:"to interrupt or prevent something from continuing normally",chinese:"干扰，扰乱",example:"The bright glare could potentially disrupt the very act of writing the programs it might run.",exampleChinese:"刺眼的强光可能会干扰到编写程序这一过程本身。"},{word:"depiction",variants:["depiction","depictions","depict"],phonetic:"/dɪˈpɪkʃn/",partOfSpeech:"n.",definition:"the way something is shown or described in a picture or story",chinese:"描绘，刻画",example:"If you look at depictions of programmers at work in television or film, you're likely to see white text on black screens.",exampleChinese:"如果你看影视剧中对程序员工作场景的刻画，很可能会看到黑屏白字的界面。"},{word:"innovation",variants:["innovation","innovations"],phonetic:"/ˌɪnəˈveɪʃn/",partOfSpeech:"n.",definition:"a new idea, method or product",chinese:"创新，新事物",example:"To call it dark mode, as we do today, and sell it as a wellness tool is a somewhat recent innovation.",exampleChinese:"像我们今天这样把它称为深色模式，并将其作为一种健康护眼工具来宣传，不过是近年来才出现的概念。"},{word:"circadian",variants:["circadian"],phonetic:"/sɜːˈkeɪdiən/",partOfSpeech:"adj.",definition:"relating to the natural daily cycle of body changes",chinese:"昼夜节律的",example:"The light-on-dark appearance could now be marketed as a way to heal your circadian rhythms.",exampleChinese:"如今，这种黑底亮字的外观可以被营销为改善昼夜节律的手段。"},{word:"suffuse",variants:["suffuse","suffuses","suffused"],phonetic:"/səˈfjuːz/",partOfSpeech:"v.",definition:"to spread over or through something",chinese:"弥漫，充满",example:"As lit-up screens suffused our every waking act, their light was doomed to overwhelm us.",exampleChinese:"当亮起的屏幕充斥着我们清醒时的每一个举动，它们的光线注定会让人难以忍受。"},{word:"inevitable",variants:["inevitable"],phonetic:"/ɪnˈevɪtəbl/",partOfSpeech:"adj.",definition:"certain to happen and impossible to avoid",chinese:"不可避免的",example:"Maybe the dark-mode age was inevitable.",exampleChinese:"也许深色模式时代的到来是不可避免的。"},{word:"ballyhoo",variants:["ballyhoo"],phonetic:"/ˈbælihuː/",partOfSpeech:"n.",definition:"loud, exaggerated publicity or advertising",chinese:"大肆宣传，喧嚷",example:"It's now gotten to the point where Microsoft can engage in dark-mode ballyhoo.",exampleChinese:"如今，事情已经发展到微软可以对深色模式进行大肆宣传的程度。"}],phrases:[{phrase:"roll out",chinese:"推出，发布",example:"In October, Google finally rolled out a new black-background view for its Calendar app."},{phrase:"follow suit",chinese:"效仿，跟着做",example:"Once that happened, individual software applications followed suit."},{phrase:"catch up with",chinese:"赶上，追上",example:"Between the early aughts and the late 2010s, the rest of humankind caught up with computer programmers."},{phrase:"at the dawn of",chinese:"在……之初，在……的黎明",example:"An ordinary person's habits have grown to be like those of the programmers writing software at the dawn of the internet."},{phrase:"stare at",chinese:"盯着看",example:"A softer, less oppressive glow for people who might be staring at their screens for many hours at a time."}],grammarNotes:[{sentence:"Dark mode also has its drawbacks: Reading lots of text is more difficult to do in white-on-black.",explanation:"冒号后对 drawbacks 作具体说明。Reading lots of text 为动名词短语作主语；in white-on-black 为介词短语作状语，意为“在黑底白字的情况下”。"},{sentence:"Another built a lighttight cot underneath his cubicle in which to take breaks to recover from the oppressive sun that poured in through office windows.",explanation:"in which to take breaks 是“介词+关系代词 which+不定式”结构，相当于 in which he could take breaks，作定语修饰 cot；to recover from... 为不定式表目的；that poured in through office windows 为定语从句修饰 the oppressive sun。"},{sentence:"Given that software developers are the people who develop software, and their software-making software had been in dark mode from the start, the latest trend should come as no surprise.",explanation:"Given that 引导原因状语从句（考虑到……），从句内由 and 连接两个并列分句；who develop software 为定语从句修饰 the people。主句为 the latest trend should come as no surprise，其中 come as no surprise 意为“不足为奇”。"}],quiz:[{question:"Why did the author's programming colleagues prefer working in the dark?",options:["To save electricity and prolong monitor life","To reduce distractions and improve focus","To avoid being seen by the office manager","To keep their code-writing secret from others"],correctAnswer:1,explanation:"P6 明确回答：If I'd asked them, they would probably have said: to reduce distractions and improve focus，即减少干扰、提高注意力，故选 B。"},{question:"What does the author imply by saying 'we are all programming computers now' in the last paragraph?",options:["Everyone should learn to write computer programs","Ordinary people's screen habits have come to resemble those of programmers","Artificial intelligence will replace human programming","Dark mode makes people spend less time on screens"],correctAnswer:1,explanation:"最后一段把深色模式从程序员桌面蔓延到所有人的桌面，归因于普通人屏幕使用习惯已与程序员趋同（P12-P13），故选 B。其余选项与原文无关。"},{question:"What is the main idea of the article?",options:["Dark mode is healthier for human eyes than light mode","The rise of dark mode reflects how screen time now pervades ordinary life","Software companies compete to produce the most effective artificial night","Dark mode was invented by programmers in the 1990s"],correctAnswer:1,explanation:"全文脉络：深色模式从程序员小众文化走向大众，其根源在于普通人屏幕时间激增、使用习惯程序员化（P12-P17）。A 只是局部优点，C 是局部现象，D 时间错误。"}]},Rp={id:"20260722",date:"20260722",title:"Pay a Little Less Attention to Your Friends",difficulty:"考研英语一 (The Atlantic)",wordCount:680,topic:"Psychology & Social Life",summary:"A psychiatrist discovers that shared distraction can help patients open up more than hyper-focused attention, challenging the American obsession with constant focus.",paragraphs:[{id:"p1",english:"About two years ago, one of my psychiatry patients was giving me particular trouble. He had depression, and despite his usual chattiness, I just couldn't find a way to engage him on our Zoom calls. He seemed to be avoiding eye contact and stayed quiet, giving only short answers to my questions. I worried he would drop out of treatment, so I suggested that we do something I rarely do with patients: go for a walk.",chinese:"大约两年前，我的一位精神病患者给我带来了特别的麻烦。他患有抑郁症，尽管他平时很健谈，但我就是找不到方法让他参与我们的Zoom电话。他似乎在避免目光接触，保持沉默，只对我的问题给出了简短的回答。我担心他会退出治疗，所以我建议我们做一些我很少对病人做的事情：去散步。"},{id:"p2",english:"We met at a park on a brisk fall day and sat on a bench when we were done. Among the few people nearby was a group of workers, who were cleaning the grounds, chatting loudly, and obviously having fun.",chinese:"我们在一个秋日在公园见面，结束后坐在长凳上。附近的几个人中有一群工人，他们正在打扫场地，大声聊天，显然玩得很开心。"},{id:"p3",english:"As I tried to ask my patient about his studies, he kept breaking eye contact with me to look at the workers. Just as we were finishing, he became tearful and said that he felt very lonely. It was the most he'd opened up to me in many months, and I was relieved.",chinese:"当我试图询问我的病人的研究时，他不断与我断绝目光接触，看着工人们。正当我们说完时，他泪流满面，说他感到非常孤独，这是几个月来他向我敞开心扉的最多一次，我松了一口气。"},{id:"p4",english:"Perhaps the sight of these convivial young men was a reminder of his painful isolation that he simply couldn't ignore. Or perhaps the act of walking together had finally made him comfortable enough to open up. Either way, it never would have happened on Zoom or in my office.",chinese:"也许这些欢乐的年轻人的景象提醒了他痛苦的孤立，他根本无法忽视。或者也许一起行走的行为终于让他感到足够舒服，可以敞开心扉。无论哪种方式，这种事都不会发生在Zoom或我的办公室里。"},{id:"p5",english:"My experience with my patient runs contrary to the American fixation on attention. At work, we are lauded for displaying unbroken focus on the task at hand, while some companies punish employees for taking too many breaks away from their computer. With friends, we are expected to be active and engaged listeners, something that demands nearly constant awareness.",chinese:"我对病人的经历与美国人对注意力的执着相反，在工作中，我们因对手头任务表现出不间断的专注而受到赞扬，而一些公司则因员工离开电脑太多时间而惩罚员工，对于朋友来说，我们被期望成为积极和专注的听众，这需要几乎持续的意识。"},{id:"p6",english:"Being hyper-focused on what people are saying and trying hard not to break your attention might seem like a way to fast-forward a friendship and make meaningful connections. But in fact, that level of intensity can make you feel less connected to other people. If you really want to nurture a relationship, shared distraction might be more powerful.",chinese:"高度关注人们所说的内容并努力不分散注意力可能看起来是快进友谊并建立有意义联系的一种方式。但事实上，这种强度会让你感觉与其他人的联系减弱。如果你真的想培养一段关系，共同分散注意力可能更有力量。"},{id:"p7",english:"If you've ever defused an awkward social situation with unrelated small talk or an icebreaker game, you're already familiar with the social benefits of distraction. Indeed, a handful of studies, while not investigating distraction per se, have suggested that engaging in a shared distracting activity, such as physical exercise, can enhance feelings of social connectedness and pleasure.",chinese:"如果您曾经通过无关的闲聊或打破僵局的游戏来化解尴尬的社交局面，那么您已经熟悉了分心的社交好处。事实上，一些研究虽然没有调查分心本身，但表明参与共同的分散注意力活动，例如体育锻炼，可以增强社交联系和快乐的感觉。"},{id:"p8",english:"This is in stark contrast to the alienating, alone-together experience of people who each engage in their own distracting activity, such as staring at their smartphone.",chinese:"这与人们各自从事自己分散注意力的活动（例如盯着自己的智能手机）的疏远、孤独的经历形成鲜明对比。"},{id:"p9",english:"Although the mechanism by which distraction might increase a feeling of social connectedness is unclear, there are some plausible explanations. Engaging in physical activity, even one as gentle as walking, has been associated with a substantial increase in creative, divergent, and associative thinking- perhaps because moving takes our focus away from ourselves.",chinese:"尽管注意力分散可能增加社交联系感的机制尚不清楚，但有一些合理的解释，从事体育活动，即使是像走路一样温和的活动，也与创造力，分歧和联想思维的大幅增加有关也许是因为运动会让我们的注意力从自己身上移开。"},{id:"p10",english:"Creative thinking, in turn, has the potential to move the conversation along in unpredictable ways, perhaps activating the neural reward pathways that rejoice in novelty and thereby making us delight more in one another's presence.",chinese:"反过来，创造性思维有可能以不可预测的方式推动对话，也许会激活因新奇而感到高兴的神经奖励途径，从而让我们对彼此的存在感到更加高兴。"},{id:"p11",english:"And moving isn't strictly necessary for the creative benefits of distraction to occur: A 2022 study published in Nature found that just taking note of one's environment can enhance creative thinking.",chinese:"移动并不是产生注意力的创造性好处的必要条件：2022年发表在《自然》杂志上的一项研究发现，只需注意自己的环境就可以增强创造性思维。"},{id:"p12",english:"That study also found that pairs working together virtually were less likely to notice their surroundings; instead, they spent more time looking directly at each other's images. This is decidedly not good for conversation. Staring at a social partner's face is cognitively and emotionally exhausting, and can be a sign of a domineering nature.",chinese:"该研究还发现，虚拟地一起工作的情侣不太可能注意到周围的环境；相反，他们花更多的时间直接看着彼此的图像。这显然不利于谈话。盯着社交伴侣的脸在认知和情感上都会让人筋疲力尽，并且可能是专横性格的标志。"},{id:"p13",english:"Just as you've probably experienced the social benefits of distraction, you've also probably noticed the social drawbacks of too much intensity. Years ago, hundreds of thousands of people, myself included, went to the Museum of Modern Art to see the Serbian conceptual artist Marina Abramović's classic performance piece, in which she sat at a small wooden table, staring silently and impassively for several minutes at the face of any visitor who sat across from her.",chinese:"正如您可能经历过分心的社交好处一样，您可能也注意到了过度集中的社交弊端。几年前，包括我自己在内的数十万人前往现代艺术博物馆观看塞尔维亚概念艺术家玛丽娜·阿布拉莫维奇的经典表演作品，她坐在一张小木桌前，静静而冷漠地盯着坐在她对面的任何访客的脸几分钟。"},{id:"p14",english:"The encounters were uncomfortable at best, and grueling at worst. By removing nearly all ambient stimulation and props, Abramović had underscored their crucial importance.",chinese:"这些遭遇充其量是不舒服的，充其量是令人筋疲力尽的。通过去除几乎所有的环境刺激和道具，阿布拉莫维奇强调了它们的至关重要性。"},{id:"p15",english:"The discomfort of extended eye contact helps explain why having natural-seeming, friendship-enforcing interactions over platforms like Zoom and FaceTime can be so difficult: They largely remove the rich world of distractions and force us to stare at the face of our social partner.",chinese:"长时间眼神接触的不适有助于解释为什么在Zoom和FaceTime等平台上进行看似自然的、强化友谊的互动会如此困难：它们在很大程度上消除了丰富的干扰世界，并迫使我们盯着社交伙伴的脸。"},{id:"p16",english:"When you have the luxury of face-to-face contact, skip the staring contest and get out in the world together. You'll be surprised at the places that can nurture conversation. Shouting over the noise can be a bonding experience. But be sure you don't pick something that's too distracting otherwise you'll each be in your own bubble of experience.",chinese:"当你们有机会面对面接触时，就跳过凝视比赛，一起走向世界。您会对可以促进对话的地方感到惊讶。克服噪音可能是一种亲密的体验。但请确保不要选择太分散注意力的东西——否则你们每个人都会陷入自己的体验泡沫中。"}],vocabulary:[{word:"psychiatry",variants:[],phonetic:"/saɪˈkaɪ.ə.tri/",partOfSpeech:"n.",definition:"the study and treatment of mental illness",chinese:"精神病学",example:"One of my psychiatry patients.",exampleChinese:"我的一位精神病患者。"},{word:"convivial",variants:[],phonetic:"/kənˈvɪv.i.əl/",partOfSpeech:"adj.",definition:"friendly and making people feel happy",chinese:"欢乐的，友好的",example:"The sight of these convivial young men.",exampleChinese:"这些欢乐的年轻人的景象。"},{word:"fixation",variants:["fixations"],phonetic:"/fɪkˈseɪ.ʃən/",partOfSpeech:"n.",definition:"an obsessive interest",chinese:"执着，固着",example:"The American fixation on attention.",exampleChinese:"美国人对注意力的执着。"},{word:"distraction",variants:["distractions"],phonetic:"/dɪˈstræk.ʃən/",partOfSpeech:"n.",definition:"something that prevents full attention",chinese:"分心，分散注意力",example:"Shared distraction might be more powerful.",exampleChinese:"共同分散注意力可能更有力量。"},{word:"defuse",variants:["defuses","defused"],phonetic:"/ˌdiːˈfjuːz/",partOfSpeech:"v.",definition:"to make a difficult situation less tense",chinese:"化解，缓和",example:"Defused an awkward social situation.",exampleChinese:"化解尴尬的社交局面。"},{word:"divergent",variants:[],phonetic:"/daɪˈvɜːr.dʒənt/",partOfSpeech:"adj.",definition:"different; developing in different directions",chinese:"发散的，不同的",example:"Divergent and associative thinking.",exampleChinese:"发散性和联想性思维。"},{word:"neural",variants:[],phonetic:"/ˈnjʊə.rəl/",partOfSpeech:"adj.",definition:"relating to the nervous system",chinese:"神经的",example:"Activating neural reward pathways.",exampleChinese:"激活神经奖励途径。"},{word:"domineering",variants:[],phonetic:"/ˌdɒm.ɪˈnɪə.rɪŋ/",partOfSpeech:"adj.",definition:"trying to control others unpleasantly",chinese:"专横的",example:"A sign of a domineering nature.",exampleChinese:"专横性格的标志。"},{word:"grueling",variants:[],phonetic:"/ˈɡruː.ə.lɪŋ/",partOfSpeech:"adj.",definition:"extremely tiring and demanding",chinese:"令人筋疲力尽的",example:"The encounters were grueling at worst.",exampleChinese:"充其量是令人筋疲力尽的。"},{word:"nurture",variants:["nurtures","nurtured","nurturing"],phonetic:"/ˈnɜːr.tʃər/",partOfSpeech:"v.",definition:"to care for and encourage growth",chinese:"培养，滋养",example:"Nurture a relationship.",exampleChinese:"培养一段关系。"}],phrases:[{phrase:"break eye contact",chinese:"移开目光",example:"Kept breaking eye contact with me."},{phrase:"open up",chinese:"敞开心扉",example:"Made him comfortable enough to open up."},{phrase:"run contrary to",chinese:"与……相反",example:"Runs contrary to the American fixation on attention."},{phrase:"nurture a relationship",chinese:"培养一段关系",example:"If you really want to nurture a relationship."},{phrase:"staring contest",chinese:"对视比赛",example:"Skip the staring contest and get out in the world together."}],grammarNotes:[{sentence:"Being hyper-focused on what people are saying and trying hard not to break your attention might seem like a way to fast-forward a friendship and make meaningful connections.",explanation:"主语为两个并列动名词短语：Being hyper-focused... AND trying hard not to break...。谓语 might seem like。to fast-forward... and make... 不定式作定语。"},{sentence:"The discomfort of extended eye contact helps explain why having natural-seeming, friendship-enforcing interactions over platforms like Zoom and FaceTime can be so difficult: They largely remove the rich world of distractions and force us to stare at the face of our social partner.",explanation:"主干：The discomfort helps explain why...。why 引导宾语从句。冒号后解释原因：主语 They(platforms) 并列谓语 remove... and force us to stare..."},{sentence:"Years ago, hundreds of thousands of people, myself included, went to the Museum of Modern Art to see the Serbian conceptual artist Marina Abramovic's classic performance piece, in which she sat at a small wooden table, staring silently and impassively for several minutes at the face of any visitor who sat across from her.",explanation:"主干：...people went to MoMA to see...。in which 非限制性定语从句修饰 piece。staring silently... 现在分词作伴随状语。who sat across from her 定语从句修饰 visitor。"}],quiz:[{question:"Why did the author's patient finally open up during the walk session?",options:["Because the author prescribed a new medication.","Because he was forced to talk about his problems.","The exact reason is unclear — distraction from workers or walking together may have helped.","Because the Zoom connection failed."],correctAnswer:2,explanation:"Paragraph 4: two possible explanations — sight of convivial workers reminded him of isolation, OR walking together made him comfortable."},{question:"What is the main problem with video call platforms according to the article?",options:["They often freeze and disconnect.","They remove natural distractions and force exhausting eye contact.","They charge too much.","They make users appear unprofessional."],correctAnswer:1,explanation:"Paragraph 15: platforms 'largely remove the rich world of distractions and force us to stare at the face of our social partner.'"},{question:"What does the Abramovic performance demonstrate?",options:["Staring at someone is a comfortable bonding experience.","Removing all stimulation makes conversation flow naturally.","Removing distraction and props makes encounters uncomfortable, underscoring their importance.","Art performances are the best places to make friends."],correctAnswer:2,explanation:"Paragraph 13-14: Abramovic's piece made encounters 'uncomfortable at best, and grueling at worst.' By removing stimulation, she 'underscored their crucial importance.'"}]},Gp={id:"20260721",date:"20260721",title:"The Kenyan Ranger Who Risks His Life to Save Rare Animal He's Seen Once",difficulty:"考研英语一 (扇贝同源)",wordCount:700,topic:"Environment & Conservation",summary:"Laban Mwangi has spent two decades protecting the critically endangered mountain bongo from poachers, facing life-threatening dangers to preserve a species he has seen only once.",paragraphs:[{id:"p1",english:"A Kenyan ranger who devoted his life to protecting an animal so rare that he has caught only a fleeting glimpse of it will receive an award for his conservation efforts.",chinese:"一名肯尼亚护林员一生致力于保护一种极其罕见的动物，罕得到他甚至只匆匆瞥见过它一次；如今，他将因这项保护工作而荣获奖项。"},{id:"p2",english:"Laban Mwangi, 43, has spent two decades trying to save the mountain bongo from extinction. The striking striped forest antelope once roamed Kenya in great numbers but has dwindled to fewer than 40 in the wild.",chinese:"现年43岁的拉班·姆旺吉（Laban Mwangi）已经倾注了二十年心血，试图拯救山地邦戈羚免于灭绝。这种长着醒目条纹的森林羚羊曾经在肯尼亚成群结队地出没，但如今在野外的数量已锐减至不足40只。"},{id:"p3",english:"In his work, Mwangi has clashed with poachers and cut thousands of snares in the Aberdare and Maasai Mau forests. With almost no sightings of the antelope, Mwangi and his team from the Mountain Bongo Project (MBP) rely on tracks, dung and the odd camera-trap image as the only evidence that the animals are still holding on in the mountains.",chinese:'在工作中，姆旺吉曾多次与偷猎者发生冲突，并在阿伯代尔和马赛茂森林里剪断了数以千计的偷猎套索。由于几乎难觅这种羚羊的踪迹，姆旺吉及"山地邦戈羚项目（MBP）"的团队成员只能依靠足迹、粪便以及偶尔拍到的红外相机照片，作为证明这些生灵仍在山林中顽强生存的唯一证据。'},{id:"p4",english:'"I want to save the mountain bongo for Kenya and for my own children to see them one day," Mwangi said. He grew up on stories from his father, who in the 1970s had been paid to capture live bongos to supply foreign zoos but later switched to protecting them, becoming the first tracker for the MBP when it was established in 2003. Laban joined him in the organisation two years later as one of its first rangers, rising through the ranks to become head ranger.',chinese:'"我想为肯尼亚拯救山地邦戈羚，也希望有一天我的孩子们能亲眼看到它们，"姆旺吉说道。他是听着父亲的故事长大的：20世纪70年代，他的父亲曾受雇活捉邦戈羚并卖给外国动物园，但后来转而保护它们，并在2003年MBP成立时成为了该项目的首位追踪员。两年后，拉班也加入了该组织，成为首批护林员之一，并凭借努力一路晋升为护林员队长。'},{id:"p5",english:"It is perilous work, spending weeks at a time in dense, mountainous forests, far from his wife and three young children. The patrols are up against illegal logging, encroachment into central Kenya's fragile ecosystems and poachers armed with guns, spears and dogs.",chinese:"这是一项极其危险的工作，他每次都要在茂密的高山森林里待上数周，远离妻子和三个年幼的孩子。巡逻队面临着诸多威胁：非法伐木、对肯尼亚中部脆弱生态系统的侵占，以及手持枪支、长矛还带着猎犬的偷猎者。"},{id:"p6",english:`Mwangi has the scars from one encounter in which he was slashed to the bone by a poacher's machete, requiring days of hospital treatment. "They are angry with us for destroying their snares and hideouts, but the dangers don't deter us from our work," he said.`,chinese:'姆旺吉身上留有一道遭遇战的伤疤，当时他被偷猎者的砍刀深及骨头地砍伤，住院治疗了数日。"他们对我们摧毁了套索和藏身处感到愤怒，但这些危险吓不倒我们，也无法阻止我们的工作，"他说。'},{id:"p7",english:'Risk comes from natural hazards. "Our patrol was once charged by elephants on a narrow path and the only way we could escape was to climb high enough up trees so they could not pull us down," he said.',chinese:'风险还来自于自然灾害。"有一次，我们的巡逻队在狭窄的小径上遭到大象的袭击，我们唯一的逃生方法就是爬上足够高的树，这样它们就无法把我们拽下来，"他说。'},{id:"p8",english:"During his 20 years with MBP, Mwangi has helped remove more than 2,000 snares, dismantled dozens of elephant traps and made hundreds of arrests related to poaching and illegal logging.",chinese:"在MBP工作的20年间，姆旺吉协助清除了2000多个套索，拆毁了数十个捕象陷阱，并参与了数百起与偷猎和非法伐木相关的抓捕行动。"},{id:"p9",english:"The work of guarding bongos, listed by the International Union for Conservation of Nature as critically endangered, has the natural benefit of protecting other vulnerable species that share their habitat, including the extremely rare yellow-backed duikers and giant pangolins.",chinese:"山地邦戈羚被国际自然保护联盟列为极危物种，保护它们的同时，自然也能惠及与它们共享栖息地的其他易危物种，包括极其罕见的黄背小羚羊和巨型穿山甲。"},{id:"p10",english:"Mwangi's efforts will be recognised this week when he receives the Tusk Wildlife Ranger Award, most likely from the Prince of Wales, the royal patron of the UK-based conservation charity which helps to fund MBP's work.",chinese:'姆旺吉的努力将在本周得到表彰，届时他将获颁"塔斯克野生动物护林员奖"。颁奖人极有可能是威尔士亲王，他是这家资助MBP工作的英国野生动物保护慈善机构的王室赞助人。'},{id:"p11",english:"Mwangi said the grant attached to the award would go towards equipment, ranger training and working with communities on the forest fringes, helping them find alternative income streams to hunting for the pot and chopping down trees. The bongos' browsing helps regulate the forest vegetation, promoting diversity and ecological balance.",chinese:"姆旺吉表示，该奖项的配套奖金将用于添置设备、开展护林员培训，以及与森林边缘的社区开展合作，帮助当地人找到替代收入来源，从而摆脱为糊口而打猎和砍伐树木的困境。此外，邦戈羚的觅食行为有助于调节森林植被，促进生态多样性和平衡。"},{id:"p12",english:"Over the years, Mwangi has reached tens of thousands of people to advocate for conserving the forests and their animal populations, including by bringing mountain bongo wildlife clubs to local schools.",chinese:"多年来，姆旺吉已经向数以万计的人宣传了保护森林及其动物种群的理念，其中就包括在当地学校推广成立山地邦戈羚野生动物俱乐部。"},{id:"p13",english:`"We are helping inspire the next generation of rangers. I tell them we can't wait for someone else to do this work and even their small actions can help," he said. "I have committed my life to protecting an animal most people will never see. That makes the work even more important."`,chinese:'"我们正在帮助激发下一代护林员的热情。我告诉他们，我们不能指望别人来做这件事，哪怕是他们微小的行动也能发挥作用，"他说。"我将一生奉献于保护一种大多数人可能永远都见不到的动物。正是这一点，让这项工作变得尤为重要。"'},{id:"p14",english:"Since Tusk was founded in 1990 it has generated £130 million to support more than 250 local conservation organisations and ranger teams across Africa.",chinese:"自1990年成立以来，塔斯克（Tusk）机构已筹集了1.3亿英镑，用于支持非洲各地超过250个本土保护组织和护林员团队。"},{id:"p15",english:"In a separate initiative, Kenya's wildlife authority is working to reintroduce a number of bongos from captivity to the wild to help boost its numbers and genetic diversity. From the original 40 or so animals that were captured and exported, there are approximately 650 being held in facilities in North America and Europe. Last month, Woburn Safari Park in Bedfordshire announced the birth of a female calf.",chinese:"在另一项举措中，肯尼亚野生动物管理局正致力于将部分圈养的邦戈羚重新放归野外，以帮助恢复其种群数量和基因多样性。最初被捕获并出口的邦戈羚大约有40只，而如今在北美和欧洲各地的设施中，圈养数量已达约650只。上个月，位于贝德福德郡的沃本野生动物园刚刚宣布了一只雌性邦戈羚幼崽的诞生。"}],vocabulary:[{word:"fleeting",variants:[],phonetic:"/ˈfliː.tɪŋ/",partOfSpeech:"adj.",definition:"lasting for only a short time",chinese:"短暂的",example:"A fleeting glimpse of it.",exampleChinese:"匆匆瞥见。"},{word:"dwindle",variants:["dwindles","dwindled"],phonetic:"/ˈdwɪn.dəl/",partOfSpeech:"v.",definition:"to become gradually less",chinese:"减少，缩减",example:"Has dwindled to fewer than 40 in the wild.",exampleChinese:"数量锐减至不足40只。"},{word:"perilous",variants:[],phonetic:"/ˈper.ɪl.əs/",partOfSpeech:"adj.",definition:"extremely dangerous",chinese:"极其危险的",example:"It is perilous work.",exampleChinese:"极其危险的工作。"},{word:"encroachment",variants:["encroachments"],phonetic:"/ɪnˈkroʊtʃ.mənt/",partOfSpeech:"n.",definition:"gradual intrusion into territory",chinese:"侵占，蚕食",example:"Encroachment into fragile ecosystems.",exampleChinese:"对脆弱生态系统的侵占。"},{word:"slash",variants:["slashes","slashed"],phonetic:"/slæʃ/",partOfSpeech:"v.",definition:"to cut with a sweeping blade motion",chinese:"砍伤",example:"Slash to the bone by a machete.",exampleChinese:"被砍刀深及骨头的砍伤。"},{word:"deter",variants:["deters","deterred"],phonetic:"/dɪˈtɜːr/",partOfSpeech:"v.",definition:"to discourage from doing something",chinese:"阻止，威慑",example:"The dangers don't deter us.",exampleChinese:"吓不倒我们。"},{word:"vulnerable",variants:[],phonetic:"/ˈvʌl.nər.ə.bəl/",partOfSpeech:"adj.",definition:"easily hurt or harmed",chinese:"易受伤的，脆弱的",example:"Protecting other vulnerable species.",exampleChinese:"保护其他易危物种。"},{word:"reintroduce",variants:["reintroduces","reintroduced"],phonetic:"/ˌriː.ɪn.trəˈdjuːs/",partOfSpeech:"v.",definition:"to bring back to a previous habitat",chinese:"重新引入",example:"Reintroduce bongos from captivity to the wild.",exampleChinese:"将圈养的邦戈羚放归野外。"},{word:"clash",variants:["clashes","clashed"],phonetic:"/klæʃ/",partOfSpeech:"v.",definition:"to fight or disagree with someone",chinese:"冲突，起争执",example:"Mwangi has clashed with poachers.",exampleChinese:"姆旺吉与偷猎者发生过冲突。"},{word:"critically",variants:[],phonetic:"/ˈkrɪt.ɪ.kəl.i/",partOfSpeech:"adv.",definition:"in an extremely serious way",chinese:"极其；临界地",example:"Critically endangered.",exampleChinese:"极危物种。"}],phrases:[{phrase:"hold on",chinese:"坚持住；继续生存",example:"The animals are still holding on in the mountains."},{phrase:"switch to",chinese:"转而做某事",example:"His father later switched to protecting them."},{phrase:"rise through the ranks",chinese:"从基层晋升",example:"Rising through the ranks to become head ranger."},{phrase:"hunt for the pot",chinese:"为糊口而打猎",example:"Alternative income to hunting for the pot."},{phrase:"commit one's life to",chinese:"将一生奉献给",example:"I have committed my life to protecting this animal."}],grammarNotes:[{sentence:"A Kenyan ranger who devoted his life to protecting an animal so rare that he has caught only a fleeting glimpse of it will receive an award for his conservation efforts.",explanation:"主干：A Kenyan ranger will receive an award。who 定语从句修饰 ranger。so rare that... 结果状语从句。"},{sentence:"He grew up on stories from his father, who in the 1970s had been paid to capture live bongos to supply foreign zoos but later switched to protecting them, becoming the first tracker for the MBP when it was established in 2003.",explanation:"主干：He grew up on stories。who 非限制性定语从句修饰 father。从句谓语并列：had been paid to capture... but switched to protecting...。becoming 现在分词短语作结果状语。"},{sentence:"The work of guarding bongos, listed by the International Union for Conservation of Nature as critically endangered, has the natural benefit of protecting other vulnerable species that share their habitat.",explanation:"主干：The work has the natural benefit。listed by... 过去分词短语作插入定语。that share their habitat 定语从句修饰 species。"}],quiz:[{question:"Why is Laban Mwangi receiving the Tusk Wildlife Ranger Award?",options:["For capturing live bongos for foreign zoos.","For his two decades of conservation work protecting the mountain bongo.","For training rangers in North America.","For research on elephant migration."],correctAnswer:1,explanation:"Paragraph 1 and 10: Mwangi devoted his life to protecting the mountain bongo and will receive the award for his efforts."},{question:"What dangers has Mwangi faced?",options:["Only natural hazards like elephants.","Only confrontations with poachers.","Both violent poacher encounters and natural hazards such as elephant charges.","Financial threats from insufficient funding."],correctAnswer:2,explanation:"Paragraph 5 mentions armed poachers, P6 describes machete injury, and P7 describes being charged by elephants."},{question:"What broader conservation benefit does guarding bongos provide?",options:["It balances the federal budget.","It naturally protects other vulnerable species sharing their habitat.","It eliminates illegal logging entirely.","It guarantees humans stop encroaching on forests."],correctAnswer:1,explanation:"Paragraph 9: guarding bongos 'has the natural benefit of protecting other vulnerable species that share their habitat.'"}]},Yp={id:"20260720",date:"20260720",title:"How Improv Comedy Can Help Resolve Conflicts",difficulty:"考研英语一 (Time)",wordCount:717,topic:"Life & Psychology",summary:"Four core rules of improv comedy—building relationships, embracing 'yes, and', bringing the love, and helping others shine—can reduce real-life conflicts.",paragraphs:[{id:"p1",english:"I co-founded an organization working with teachers around the globe to advance humane education, a field that prepares people to create a more just and peaceful future.",chinese:"我参与创立了一个组织，与全球各地的教师合作，旨在推进人文教育；这一领域致力于让人们为创造一个更加公正、和平的未来做好准备。"},{id:"p2",english:"Transforming schools, curricula, and strategies for positive change is no easy task these days. But I discovered a new powerful approach: improv comedy.",chinese:"如今，要想改变学校、课程和策略以实现积极的变革绝非易事。但我发现了一种极其有效的新方法：即兴喜剧。"},{id:"p3",english:`The more I practiced, the more I witnessed improv's power to cultivate a solutions-focused mindset and diminish the polarization that stymies positive change. The key lay in four core rules: building relationships, embracing "yes, and", bringing the love, and helping others shine.`,chinese:'随着练习的深入，我愈发真切地感受到即兴表演的力量：它不仅能培养人们以解决问题为导向的思维模式，还能消除阻碍积极变革的两极分化现象。其中的关键在于四条核心原则：建立联系、接纳"是的，而且……"的思维、传递善意，以及成就他人。'},{id:"p4",english:"Building relationships",chinese:"第一条原则：建立联系"},{id:"p5",english:'The reason "building relationships" is the first rule of improv comedy is because without establishing a relationship, the actors struggle to care about each other, express relatable emotions, and move the scene forward.',chinese:'"建立联系"之所以成为即兴喜剧的首要原则，是因为如果缺乏联系，演员们就很难去真正关心彼此，难以表达出引起共鸣的情感，更无法推动剧情的发展。'},{id:"p6",english:"If the actors don't care, neither will the audience. Improvisors must establish a relationship even when they don't naturally relate to or like what their scene partner is doing or saying.",chinese:"如果连演员自己都不在乎，观众自然也会无动于衷。即兴表演者必须学会建立联系，哪怕他们本能地无法理解或反感搭档的所作所为、所言所语。"},{id:"p7",english:"To effectively address real-life problems, we also need to build relationships with those we don't relate to or who do and say things we don't like.",chinese:"为了有效解决现实生活中的问题，我们也需要与那些和我们毫无交集、甚至言行令我们反感的人建立联系。"},{id:"p8",english:"I know that unless I build such relationships, I'm more likely to stereotype and possibly even vilify others who have different beliefs, as well as miss opportunities to cooperatively develop solutions to problems. The more I build these relationships, the more successful I am at understanding divergent perspectives and even shifting others' thinking.",chinese:"我深知，如果不去建立这样的联系，我便更有可能对他人产生刻板印象，甚至去贬低那些信仰不同的人，进而错失合作解决问题的良机。而这种联系建立得越多，我就越能透彻地理解不同的观点，甚至能够改变他人的想法。"},{id:"p9",english:'Embracing "yes and"',chinese:'第二条原则：接纳"是的，而且……"的思维'},{id:"p10",english:'The second improv rule is "yes, and," which refers to the practice of embracing whatever premise a scene partner suggests ("yes") and adding to the prompts they offer ("and").',chinese:'第二条即兴表演原则是"是的，而且……"，这是一种沟通实践：先全盘接受搭档提出的任何前提条件（"是的"），然后顺势在他们的提示上进一步延展（"而且……"）。'},{id:"p11",english:`In improv comedy, "yes, and" primes us to listen carefully and welcome others' suggestions so we can collaborate on creating a great scene.`,chinese:"在即兴喜剧中，这种思维引导我们仔细倾听并欣然接受他人的建议，从而促成完美的合作，共同呈现一场精彩的演出。"},{id:"p12",english:'In our everyday lives, "yes, and" is a mindset that asks us to look for points of agreement and then add our own ideas. Embracing "yes, and" can be quite challenging, especially around highly charged issues. Nonetheless, we can usually find some area of agreement.',chinese:'在日常生活中，"是的，而且……"更像是一种心态，它要求我们先寻找彼此的共识，然后再补充自己的想法。践行这一原则可能极具挑战性，尤其是在面对高度敏感、剑拔弩张的议题时。尽管如此，我们通常还是能找到一些达成共识的空间。'},{id:"p13",english:"If we can begin with even a thread of agreement about a problem, that common ground opens the possibility for respectfully sharing ideas and paves the way for potential collaboration.",chinese:"如果我们能在一个问题上找到哪怕只有一丝一毫的共识，这种共同点就能为相互尊重地交流思想创造可能，并为潜在的合作铺平道路。"},{id:"p14",english:"Bringing the love",chinese:"第三条原则：传递善意"},{id:"p15",english:`Rule three, "bringing the love," is foundational to improv comedy because conflicts on stage aren't usually funny. In real life, bringing the love often requires significant effort. It's often much easier to focus on negatives.`,chinese:'第三条原则"传递善意"是即兴喜剧的基石，因为舞台上的纯粹冲突通常毫无笑点。在现实生活中，传递善意往往需要付出极大的努力。相比之下，盯着消极面不放则容易得多。'},{id:"p16",english:"Who expresses love for the people driving respectfully alongside us on the highway? As soon as we're cut off in traffic, however, we may lay on the horn and practically lose our minds with fury.",chinese:"在高速公路上，有谁会去向那些规规矩矩与我们并排行驶的司机表达善意呢？然而，一旦有人强行加塞，我们可能就会猛按喇叭，甚至愤怒到近乎失去理智。"},{id:"p17",english:"Extend this tendency toward society at large, and a cesspool of vitriol often spews from our psychic underworld through the comfort of our keyboards or the power of a mob. Meanwhile, solutions to problems become ever more elusive as we burn potential bridges and fuel our outrage.",chinese:"如果将这种倾向放大到整个社会，潜藏在我们心理暗处的恶意往往就会化作恶毒的污言秽语，躲在敲击键盘的舒适区里，或是借着乌合之众的声势喷涌而出。与此同时，随着我们亲手毁掉潜在的沟通桥梁、不断助长愤怒情绪，问题的解决之道也就变得愈发渺茫。"},{id:"p18",english:"In improv comedy, the actors have an advantage: they're actively endeavoring to bring the love. In real life, we're frequently faced with others doing anything but, which makes bringing the love that much harder.",chinese:"在即兴喜剧中，演员们具备一种优势：他们都在积极主动地传递善意。但在现实生活中，我们经常要面对别人的恶意相向，这就使得传递善意变得异常艰难。"},{id:"p19",english:"Yet when we successfully meet hostility with love to the degree that this is possible and makes sense it's not uncommon to watch that love melt another's anger. When this happens, even solving our most intractable problems seems possible.",chinese:"然而，只要条件允许且合乎情理，当我们成功地用善意去化解敌意时，善意融化愤怒的场景其实并不罕见。每当这种奇迹发生，即使是解决最棘手的问题似乎也变得充满希望。"},{id:"p20",english:"Helping others shine",chinese:"第四条原则：成就他人"},{id:"p21",english:'Finally, improvisers strive to "help others shine." They know that as their fellow actors shine, so shines the scene. As in improv comedy, so in life. Adopting this rule offers us a way to dial down our desire for the spotlight in favor of a bigger goal.',chinese:'最后，即兴表演者总是致力于"成就他人"。他们懂得，只有当同台的演员光芒四射时，整个舞台才会熠熠生辉。人生亦如即兴喜剧。遵循这条原则能让我们学会克制爱出风头的欲望，转而为了更宏大的目标而努力。'},{id:"p22",english:"As more of us seek out, learn from, and share whatever is worthy of light and amplify the voices of those doing good work that's flying under the radar - building humane and sustainable societies may even become likely.",chinese:"当越来越多的人去主动发现、学习并分享那些值得赞颂的事物，去为那些默默无闻却在做着好人好事的人发声时——建设一个充满人道主义且可持续发展的社会，或许就不再只是遥不可及的梦想。"},{id:"p23",english:"Just as developing good improv skills requires practice, it takes practice to apply these rules in real life. Establishing such a practice isn't easy. It requires a commitment to listening, staying present, and remaining open.",chinese:"正如练就出色的即兴表演技巧需要不断练习一样，将这些原则应用到现实生活中同样需要反复磨砺。养成这种习惯绝非易事。它要求我们全心全意地去倾听，活在当下，并始终保持开放包容的心态。"},{id:"p24",english:"But the more we practice, the greater the rewards: more meaningful relationships, increased curiosity and creativity, and successful collaboration to uncover and implement solutions to the thorny problems we face.",chinese:"但只要我们越是努力践行，获得的回报就会越丰厚：我们将建立更有意义的人际关系，激发更强烈的好奇心与创造力，并且能够通过成功的合作，去发现并落实化解棘手问题的方案。"}],vocabulary:[{word:"cultivate",variants:["cultivates","cultivated","cultivating"],phonetic:"/ˈkʌl.tɪ.veɪt/",partOfSpeech:"v.",definition:"to develop by careful effort",chinese:"培养，培育",example:"Improv's power to cultivate a solutions-focused mindset.",exampleChinese:"即兴表演能培养以解决问题为导向的思维模式。"},{word:"diminish",variants:["diminishes","diminished","diminishing"],phonetic:"/dɪˈmɪn.ɪʃ/",partOfSpeech:"v.",definition:"to make something become smaller",chinese:"削弱，减少",example:"Diminish the polarization that stymies positive change.",exampleChinese:"削弱阻碍积极变革的两极分化。"},{word:"polarization",variants:["polarizations"],phonetic:"/ˌpoʊ.lər.ɪˈzeɪ.ʃən/",partOfSpeech:"n.",definition:"division into two sharply
