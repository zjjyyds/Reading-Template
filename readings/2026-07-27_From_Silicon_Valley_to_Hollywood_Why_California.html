 */const Yp=[["path",{d:"M18 6 6 18",key:"1bl5f8"}],["path",{d:"m6 6 12 12",key:"d8bk6v"}]],Gp=$e("x",Yp),Qp={id:"2026-07-28",date:"2026-07-28",title:"Digital Twins Are Fast Becoming Part of Everyday Life",difficulty:"考研英语一 (The Economist)",wordCount:680,topic:"Technology & Future Science",summary:"Digital twins—virtual working models of physical bodies, products, and cities—are rapidly permeating medicine, industry, and daily life. Supercharged by artificial intelligence, they offer predictive optimization while raising crucial questions about data privacy, security, and cognitive bias.",paragraphs:[{id:"p1",english:"When visiting a doctor a few years from now, you can expect to be accompanied by a virtual version of yourself. This so-called digital twin will be a working model of your body that can be summoned onto a physician's computer screen.",chinese:"几年后去看医生时，你身边可能还会跟着一个“虚拟版的自己”。这个所谓的“数字孪生”（digital twin）将是你身体的一个可运行动态模型，随时可以被调取到医生的电脑屏幕上。"},{id:"p2",english:"Updated with your latest vital signs, it will help the doctor make an accurate diagnosis. It also opens the door for medicines and procedures designed specifically for you, greatly increasing recovery rates.",chinese:"在导入你最新的生命体征数据后，它能协助医生做出精准诊断。它还为量身定制的药物和诊疗方案打开了大门，从而大幅提升康复率。"},{id:"p3",english:"This might seem like fantasy, but the foundations are being laid. Researchers at Queen Mary University of London already use computer simulations of the hearts of individual patients to evaluate different treatments for atrial fibrillation, a common disorder. It would be far too risky to experiment this way on someone's real heart. With other organs also being twinned by scientists, it seems likely they will eventually link up to form a virtual body.",chinese:"这听起来或许像科幻幻想，但其根基正在一步步奠定。伦敦玛丽女王大学的研究人员已经开始利用患者心脏的计算机模拟模型，来评估治疗房颤（一种常见的心律失常）的不同方案。毕竟在真人的心脏上直接进行这类实验风险太高。随着科学家也在为其他器官构建数字孪生，它们最终很可能会连接成一个完整的虚拟人体。"},{id:"p4",english:"Digital twins are starting to pop up everywhere. Among other things, they monitor the health of jet engines on airliners, keep track of Uber's network of vehicles and replicate Amazon's extensive supply chain well enough for the online retailer to accurately forecast sales several years ahead.",chinese:"数字孪生正开始在各个领域纷至沓来。除其他应用外，它们可以监控客机喷气发动机的运行健康，追踪 Uber 的车辆调度网络，还能高度拟真亚马逊庞大的供应链，让这家电商巨头能够精准预测未来几年的销售情况。"},{id:"p5",english:"They are helping local authorities respond to the effects of flooding and letting carmakers shave years off the development of new models by simulating test drives and crashes. Twins are also being developed to help manage factories, companies and entire cities.",chinese:"它们正在帮助地方政府应对洪涝灾害的影响；通过模拟试驾和碰撞测试，让汽车制造商将新车型的开发周期缩短数年。此外，人们还在开发数字孪生，以协助管理工厂、企业乃至整座城市。"},{id:"p6",english:"All this is being turbo-charged by recent progress in artificial intelligence(ai), which gives twins the ability to make predictions about their physical counterparts, and fine-tune themselves on new data.",chinese:"人工智能（AI）的最新突破正在为这一切提供强劲推力——AI 赋予了数字孪生预测其物理实体发展状况的能力，并使其能根据新数据不断进行自我微调。"},{id:"p7",english:"Digital twins began as basic computer models of physical objects and systems. As computers have become more powerful, twins have become more sophisticated. Complex design and modelling software means many physical objects initially take shape in the virtual world.",chinese:"数字孪生最初只是物理对象和系统的基础计算机模型。随着计算机性能日益强大，数字孪生也变得越来越精密复杂。复杂的设计与建模软件意味着，许多物理实体最初都是在虚拟世界中孕育定型的。"},{id:"p8",english:"Small sensors, capable of measuring all sorts of things, feed twins with real-time data, ensuring that they mirror their physical counterparts. A Formula 1 racing car, for instance, may have more than 250 sensors updating its digital twin during a grand prix.",chinese:"能够测量各种参数的微型传感器持续为数字孪生喂入实时数据，确保它们能实时映射其物理实体。例如，在分站赛（大奖赛）期间，一辆一级方程式（F1）赛车身上可能装有 250 多个传感器，时刻更新着它的数字孪生模型。"},{id:"p9",english:"The use of ai takes all this much further, allowing virtual models to become more sophisticated, and to both simulate and optimise activities in the real world.",chinese:"人工智能的应用将这一切推向了更高的维度，使虚拟模型变得愈发精细，不仅能模拟现实世界的活动，还能对其进行深度优化。"},{id:"p10",english:"The idea of creating symbolic representations of real-world things is centuries old. Many ancient civilisations built architectural models, sometimes to place into tombs but also to work out how to build things. Double-entry book-keeping, developed in the 15th century, was a paper-based representation of a merchant's finances.",chinese:"为现实世界的物体构建象征性表征的做法已有数百年历史。许多古代文明都会建造建筑模型，有时用于陪葬，但也用于推演施工方案。15 世纪发展起来的“复式记账法”，就是用纸质形式对商人的财务状况进行的一种模拟呈现。"},{id:"p11",english:'The Phillips Machine, a hydraulic computer from the 1940s, created a physical "twin" of national economic flows. Spreadsheets and supply-chain management systems enable companies to log transactions, track inventory, make forecasts and model future scenarios.',chinese:"诞生于 20 世纪 40 年代的液压计算机“菲利普斯机”（Phillips Machine），曾为国民经济流动构建了一个物理上的“孪生实体”。而电子表格和供应链管理系统，则让企业能够记录交易、追踪库存、做出预测，并对未来的可能情景进行建模推演。"},{id:"p12",english:"Today's digital twins extend this process, making it easier for humans to tackle complex problems. They can act as virtual crystal balls, allowing people to peer into the future, spot problems before they materialise and test wild ideas without real-world consequences.",chinese:"如今的数字孪生延续并拓展了这一演进过程，使人类更容易应对极其复杂的问题。它们可以充当“虚拟水晶球”，让人类洞察未来，在隐患爆发前及时发现问题，并在无需承担现实风险的前提下大胆测试各种奇思妙想。"},{id:"p13",english:"For businesses, this should mean better designs, more streamlined operations and fewer costly blunders. For society, the promise is equally tantalising: personalised health care, cities that flow and breathe more easily and, thanks to the threats exposed by climate modelling, clues as to how the planet might avoid environmental catastrophe. Digital twins offer the ultimate sandbox in which castles can be built and tested before being made real.",chinese:"对企业而言，这意味着更优秀的设计、更高效精简的运营，以及更少代价高昂的失误。对社会而言，其前景同样令人心动：个性化医疗、运转更顺畅且更具“呼吸感”的城市；此外，借助气候模型揭示的危机，人们还能获得指导地球如何避免环境灾难的线索。数字孪生提供了终极的“沙盒”，人们可以在城堡落地为现实之前，先在其中建构并检验它们。"},{id:"p14",english:"Could these virtual doppelgangers go rogue? They might if they are programmed badly, or hacked into. Avoidable medical conditions could be ignored, corporate systems sent awry and critical power plants compromised.",chinese:"这些虚拟分身会失控甚至“作恶”吗？如果程序编写失当或遭到黑客入侵，完全有这种可能。届时，本可避免的健康隐患可能被忽视，企业系统可能陷入混乱，甚至关键发电厂也可能遭到破坏。"},{id:"p15",english:"Digital twins will gobble up mountains of data, some of it wrong, some of it prejudiced and much of it raising concerns about privacy and surveillance. There is also the danger of tunnel vision as humans rely more and more on digital twins - and miss things that sensors might not be able to capture.",chinese:"数字孪生将吞噬海量数据，其中不乏错误或带有偏见的信息，且大部分数据会引发人们对隐私泄露和监控的担忧。此外，随着人类越来越依赖数字孪生，还存在“管道视野”（思维局限）的风险——容易遗漏传感器可能无法捕捉到的盲区。"},{id:"p16",english:"Yet these risks are not specific to digital twins. They apply to all emerging technologies, as they always have and always will. Such concerns need to be considered, as in the current debate over the use of ai. The emergence of the digital mirror world will doubtless raise new questions, but its potential advantages are already plain to see.",chinese:"然而，这些风险并非数字孪生所独有，而是适用于所有新兴技术——过去如此，未来亦然。正如目前关于 AI 应用的辩论一样，此类担忧确实需要审慎考量。数字“镜像世界”的兴起无疑会引发全新的课题，但其潜在的巨大优势早已显而易见。"}],vocabulary:[{word:"vital",variants:["vitals"],phonetic:"/ˈvaɪ.təl/",partOfSpeech:"adj.",definition:"vital signs: clinical measurements that indicate the state of a patient's essential body functions",chinese:"生命的，维持生命所必需的",example:"Updated with your latest vital signs, it will help the doctor make an accurate diagnosis.",exampleChinese:"在导入你最新的生命体征数据后，它能协助医生做出精准诊断。"},{word:"replicate",variants:["replicates","replicated","replicating"],phonetic:"/ˈrep.lɪ.keɪt/",partOfSpeech:"v.",definition:"make an exact copy of; reproduce or simulate",chinese:"复制，精准模拟/重现",example:"Replicate Amazon's extensive supply chain well enough to forecast sales.",exampleChinese:"高度拟真亚马逊庞大的供应链，从而精准预测销售。"},{word:"sophisticated",variants:["sophistication"],phonetic:"/səˈfɪs.tɪ.keɪ.tɪd/",partOfSpeech:"adj.",definition:"having or showing a high degree of complexity, refinement, or advanced development",chinese:"精密复杂的，高度先进的",example:"As computers have become more powerful, twins have become more sophisticated.",exampleChinese:"随着计算机性能日益强大，数字孪生也变得越来越精密复杂。"},{word:"symbolic",variants:["symbolically","symbol"],phonetic:"/sɪmˈbɒl.ɪk/",partOfSpeech:"adj.",definition:"serving as a representation or symbol of something else",chinese:"象征性的，符号表征的",example:"The idea of creating symbolic representations of real-world things is centuries old.",exampleChinese:"为现实世界的物体构建象征性表征的做法已有数百年历史。"},{word:"scenario",variants:["scenarios"],phonetic:"/səˈnɑː.ri.əʊ/",partOfSpeech:"n.",definition:"a written outline or postulated sequence of possible future events",chinese:"预案，设想的情景",example:"Make forecasts and model future scenarios.",exampleChinese:"做出预测，并对未来的可能情景进行建模推演。"},{word:"tantalising",variants:["tantalize","tantalizing","tantalizingly"],phonetic:"/ˈtæn.təl.aɪ.zɪŋ/",partOfSpeech:"adj.",definition:"tormenting or teasing with the sight or promise of something unobtainable or desirable",chinese:"令人心动的，诱人的",example:"For society, the promise is equally tantalising.",exampleChinese:"对社会而言，其前景同样令人心动。"},{word:"sandbox",variants:["sandboxes"],phonetic:"/ˈsænd.bɒks/",partOfSpeech:"n.",definition:"an isolated environment for testing software or ideas safely",chinese:"沙盒，虚拟试验场",example:"Digital twins offer the ultimate sandbox in which castles can be built and tested.",exampleChinese:"数字孪生提供了终极的“沙盒”，供人们在其中建构并检验方案。"},{word:"doppelganger",variants:["doppelgangers"],phonetic:"/ˈdɒp.əlˌɡæŋ.ər/",partOfSpeech:"n.",definition:"an apparition or double of a living person",chinese:"虚拟分身，双胞胎映像",example:"Could these virtual doppelgangers go rogue?",exampleChinese:"这些虚拟分身会失控甚至“作恶”吗？"},{word:"rogue",variants:["rogues"],phonetic:"/rəʊɡ/",partOfSpeech:"adj.",definition:"behaving in an erratic, dangerous, or uncontrolled way (go rogue)",chinese:"go rogue: 失控，违规作恶",example:"Could these virtual doppelgangers go rogue?",exampleChinese:"这些虚拟分身会失控甚至作恶吗？"},{word:"prejudiced",variants:["prejudice","prejudices"],phonetic:"/ˈpredʒ.ə.dɪst/",partOfSpeech:"adj.",definition:"having or showing a dislike or bias that is not based on reason or actual experience",chinese:"存有偏见的，有倾向性的",example:"Some of it wrong, some of it prejudiced.",exampleChinese:"其中不乏错误或带有偏见的信息。"}],phrases:[{phrase:"open the door for",chinese:"为...打开大门/创造条件",example:"It also opens the door for medicines and procedures designed specifically for you."},{phrase:"pop up",chinese:"突然出现，在各处纷至沓来",example:"Digital twins are starting to pop up everywhere."},{phrase:"shave off",chinese:"削减，大幅缩短（时间/成本）",example:"Letting carmakers shave years off the development of new models."},{phrase:"go rogue",chinese:"失控，脱轨，背叛正轨",example:"Could these virtual doppelgangers go rogue?"},{phrase:"tunnel vision",chinese:"管道视野，思维局限（忽视盲区）",example:"There is also the danger of tunnel vision as humans rely more and more on digital twins."}],grammarNotes:[{sentence:"Among other things, they monitor the health of jet engines on airliners, keep track of Uber's network of vehicles and replicate Amazon's extensive supply chain well enough for the online retailer to accurately forecast sales several years ahead.",explanation:"句中 they 指代 digital twins。谓语由三个并列动词构成：monitor..., keep track of..., and replicate...。末尾 'well enough for... to...' 为“足够...以至于使...能够...”句型，其中 'for the online retailer' 作不定式 'to accurately forecast...' 的逻辑主语。"},{sentence:"For society, the promise is equally tantalising: personalised health care, cities that flow and breathe more easily and, thanks to the threats exposed by climate modelling, clues as to how the planet might avoid environmental catastrophe.",explanation:"冒号后由三个并列名词短语补充说明 'the promise'：1. personalised health care; 2. cities that flow and breathe (that引导定语从句修饰cities); 3. clues as to how... (clues后接介词短语as to，其宾语为how引导的从句)。"},{sentence:"Digital twins will gobble up mountains of data, some of it wrong, some of it prejudiced and much of it raising concerns about privacy and surveillance.",explanation:"主干为 'Digital twins will gobble up mountains of data'。逗号后为三个独立主格结构（或代词无冠词同位语短语）作补充状语：1. 'some of it (being) wrong'; 2. 'some of it (being) prejudiced'; 3. 'much of it raising concerns...' (现在分词短语作独立主格谓语)。"}],quiz:[{question:"According to Paragraph 3, why do researchers use digital simulations of patients' hearts?",options:["Because real human hearts are impossible to locate in hospitals.","Because experimenting directly on a real patient's heart carries excessively high risks.","Because computer models can completely replace human doctors in prescribing medications.","Because building physical heart models is much cheaper than running software."],correctAnswer:1,explanation:"Paragraph 3 explicitly states: 'It would be far too risky to experiment this way on someone's real heart.'"},{question:"What is the primary contribution of artificial intelligence (AI) to digital twins as described in Paragraph 6 and 9?",options:["It eliminates the need for any hardware sensors.","It enables twins to predict real-world counterpart developments and self-fine-tune using new data.","It reduces the financial cost of purchasing computers to zero.","It guarantees that digital models will never be hacked."],correctAnswer:1,explanation:"Paragraph 6 and 9 highlight that AI gives twins 'the ability to make predictions about their physical counterparts, and fine-tune themselves on new data' while optimizing real-world activities."},{question:"Which of the following is highlighted as a potential risk of relying heavily on digital twins in Paragraph 14-15?",options:["A sudden decrease in global cloud computing capacity.","Data privacy concerns, flawed programming, and 'tunnel vision' from sensor blind spots.","The total abolition of double-entry bookkeeping systems.","The inability of carmakers to simulate vehicle crashes."],correctAnswer:1,explanation:"Paragraphs 14 and 15 mention risks including bad programming/hacking, data privacy/surveillance concerns, prejudiced data, and 'tunnel vision' from missed sensor blind spots."}]},Xp={id:"2026-07-27",date:"2026-07-27",title:"From Silicon Valley to Hollywood, Why California's Job Market Is Taking a Hit",difficulty:"考研英语一 (LA Times)",wordCount:760,topic:"Economy & Employment",summary:"California, one of the world's largest economies, is facing widespread layoffs across tech, entertainment, and agriculture due to AI displacement, industry contractions, and broader macroeconomic uncertainties, reflecting a troubling K-shaped economic divide.",paragraphs:[{id:"p1",english:"California is among the world's largest economies, but the engines that drive it haven't been firing on all cylinders.",chinese:"加州是全球最大的经济体之一，但驱动其发展的引擎如今未能马力全开。"},{id:"p2",english:"The state has been buffeted by a litany of layoffs this year from Hollywood to Silicon Valley and beyond. Economists cite several explanations, including contraction in the entertainment industry, displacements caused by artificial intelligence and overall uncertainty in the national economy.",chinese:"今年以来，从好莱坞到硅谷乃至更多地区，加州遭受了一连串裁员风暴的冲击。经济学家指出了多重原因，包括娱乐产业的萎缩、人工智能引发的岗位替代，以及全美经济整体的不确定性。"},{id:"p3",english:"Seemingly no corner of entertainment and tech has been immune from the cost-cutting that has put workers on edge.",chinese:"娱乐与科技领域的各个角落似乎都未能幸免于这场降本增效，导致从业者人人自危、紧张不安。"},{id:"p4",english:'"People are hunkering down because they think a storm is coming," UC Berkeley labor economist Jesse Rothstein said.',chinese:"加州大学伯克利分校的劳动经济学家杰西·罗斯坦（Jesse Rothstein）表示：“人们正在收缩开支、观望防御，因为他们觉得一场风暴即将到来。”"},{id:"p5",english:"Through October, there were 158,734 layoffs announced in California, compared with 136,661 for the same period last year. That was the most of any state, lagging behind only Washington, D.C., which has been hit hard by federal downsizing, according to outplacement firm Challenger, Gray & Christmas Inc.",chinese:"据职业转换与再就业服务公司 Challenger, Gray & Christmas Inc. 的数据，截至10月份，加州今年已公布的裁员人数达 158,734 人，高于去年同期的 136,661 人。这一数字居全美各州之首，仅次于因联邦政府缩编而受到重创的华盛顿特区。"},{id:"p6",english:"Nationwide, the layoffs have topped 1 million for the year, the highest since 2020, according to Challenger.",chinese:"Challenger 公司的数据还显示，全美今年的裁员总数已突破 100 万大关，创下 2020 年以来的最高纪录。"},{id:"p7",english:"As in the late 1990s, there's a disruptive technology at play again: artificial intelligence, which is fueling a Silicon Valley investment boom reminiscent of the buildup to the last tech bust.",chinese:"正如 20 世纪 90 年代末那样，一项颠覆性技术再次发挥作用：人工智能正在掀起一场硅谷投资热潮，这让人不禁联想起上一轮科技泡沫破裂前的狂热蓄势。"},{id:"p8",english:"AI has been cited in more than 48,000 of the U.S. job cuts this year, with about 31,000 of those taking place in October alone, Challenger said.",chinese:"Challenger 指出，在今年全美裁员原因中，有超过 4.8 万个岗位裁减被归咎于人工智能，其中仅 10 月份就占了约 3.1 万个。"},{id:"p9",english:'"AI is replacing some of the entry-level jobs in tech. And yes, AI is actually replacing some jobs in Hollywood," said economist Chris Thornberg, founding partner at Beacon Economics in Los Angeles.',chinese:"洛杉矶 Beacon Economics 咨询公司的创始合伙人、经济学家克里斯·桑伯格（Chris Thornberg）表示：“AI 正在取代科技领域的部分初级岗位。而且没错，AI 在好莱坞也确实正在替代一些工作。”"},{id:"p10",english:`Other factors are at work too. Intel Chief Executive Lip-Bu Tan emailed employees after the company lost $821 million in the first quarter that becoming more efficient was key to a turnaround. "I'm a big believer in the philosophy that the best leaders get the most done with the fewest people," he wrote.`,chinese:"其他因素也在发挥作用。英特尔首席执行官陈立武（Lip-Bu Tan）在公司第一季度亏损 8.21 亿美元后给员工发邮件称，提升效率是实现业绩逆转的关键。他写道：“我深信这样一条理念：最优秀的领导者是用最少的人办成最多的事。”"},{id:"p11",english:"The layoffs have challenged the notion that engineering jobs are a safe and sure path to success, perhaps in a way not since the first tech bust.",chinese:"这一波裁员打破了“从事工程技术岗位就是通往成功的避风港与铁饭碗”的传统观念，这种冲击力度或许是自首次科技泡沫破裂以来前所未有的。"},{id:"p12",english:"The mood is glum as well in Hollywood, where a succession of challenges including the dual writers' and actors' strikes in 2023 and runaway production to other locales has taken a toll - and that was before the current wave of consolidations that is threatening more job losses, with Warner Bros. the latest studio on the block.",chinese:"好莱坞的情绪同样一片低迷。2023 年编剧和演员的双重罢工，以及影视制作向外地转移等一连串挑战，已经让该行业大伤元气——而这还发生在当前可能引发更多失业的行业整合浪潮之前，华纳兄弟（Warner Bros.）就是最新被推上拍卖台的制片厂。"},{id:"p13",english:"The downsizing has contributed to California having the highest unemployment rate in the nation at 5.5% in August, with the exception of Washington, D.C. though the state's large farm economy with its agricultural workforce is a big contributor to its persistently high rate, Thornberg said.",chinese:"桑伯格指出，人员裁减导致加州 8 月份失业率达到 5.5%，居全美各州之首（华盛顿特区除外）；不过，加州庞大的农业经济及其农业劳动力群体，也是导致其失业率居高不下的重要原因。"},{id:"p14",english:"The rate is unchanged from July but up from 5.3% a year earlier. (More recent figures have been delayed by the government shutdown.)",chinese:"该失业率与 7 月持平，但高于去年同期的 5.3%。（由于联邦政府停摆，更近期的统计数据已被迫延迟公布。）"},{id:"p15",english:"The job insecurity is reflected in the percentage of workers quitting their jobs, which fell to 1.9% in August, a 10-year low.",chinese:"这种就业缺乏安全感的心态体现在离职率上——8 月份自愿离职的工人比例降至 1.9%，创下 10 年来的最低点。"},{id:"p16",english:"Yet for all the doom and gloom, there isn't any consensus that the local, state or national economies are heading into a recession, even with the federal administration's erratic tariff and immigration policies that have whipsawed industries and created economic uncertainty for businesses.",chinese:"然而，尽管前景看似一片悲观，但对于地方、全州或全国经济是否正在走向衰退，各界并未达成共识；即使联邦政府反复无常的关税和移民政策令各大行业饱受折磨，并给企业带来了巨大的经济不确定性。"},{id:"p17",english:"Part of the reason is that job creation has held up, with the most recent report last week showing the economy added 119,000 nonfarm jobs in September, exceeding forecasts, even as the unemployment rate edged up a tenth of a point to 4.4%.",chinese:"部分原因在于岗位创造依然保持了韧性。上周公布的最新报告显示，9 月份全美非农就业岗位增加了 11.9 万个，超出了先前的预测，尽管总体失业率微升 0.1 个百分点至 4.4%。"},{id:"p18",english:"Another significant reason, of course, is the river of money flowing into AI. Last year, private investment in AI totaled about $109 billion in the U.S., with China and the U.K. under $10 billion, according to the Stanford Institute for Human-Centered Artificial Intelligence.",chinese:"当然，另一个重要原因是滔滔不绝涌入人工智能领域的巨额资金。斯坦福大学以人为本人工智能研究所的数据显示，去年美国人工智能领域的私人投资总额约为 1090 亿美元，而中国和英国均不足 100 亿美元。"},{id:"p19",english:"By one estimate, Silicon Valley tech giants will invest more than $400 billion this year in AI data centers. Amazon, which recently announced plans to cut 14,000 corporate jobs, said this week that it would invest up to $50 billion to expand its AI and supercomputing services for the U.S. government.",chinese:"据估计，硅谷科技巨头今年将在 AI 数据中心上投入超过 4000 亿美元。最近宣布计划裁减 1.4 万个白领行政岗位的亚马逊本周表示，将投资高达 500 亿美元，为美国政府拓展其 AI 与超级计算服务。"},{id:"p20",english:"Moody's Analytics estimates AI spending this year has added more than half a point to gross domestic product and is helping keep the U.S. out of a recession.",chinese:"穆迪分析（Moody's Analytics）估计，今年在人工智能方面的支出为国内生产总值（GDP）拉动了超过 0.5 个百分点的增长，并助力美国避免陷入衰退。"},{id:"p21",english:"Now, the bigger fear is that the spending is feeding a gigantic stock market bubble that has benefited higher-income consumers while middle-class and lower-income workers worry more about keeping a job and a roof over their heads.",chinese:"如今更大的担忧在于，这些巨额支出正在吹大一个庞大的股市泡沫——这一泡沫让高收入消费者大受其益，而中产阶级和低收入工人却不得不为保住饭碗和安身之所而发愁。"},{id:"p22",english:"The volatile market was calmed last week only when AI chipmaker Nvidia reported strong earnings.",chinese:"直到上周 AI 芯片巨头英伟达（Nvidia）公布强劲的财报后，动荡不安的市场才得以稍微平复。"},{id:"p23",english:"The University of Michigan's consumer sentiment index fell to 51.0 this month, down from 53.6 in October, with a number above 50 indicating a positive sentiment. Survey economists point to persistent inflation and the loss of income.",chinese:"密歇根大学本月公布的消费者信心指数从 10 月份的 53.6 降至 51.0（指数高于 50 代表情绪偏积极）。主持调查的经济学家指出，持续的通货膨胀和收入损失是导致信心下滑的主因。"},{id:"p24",english:"To put the statistic into perspective, the index is lower than at the height of the Great Recession in 2008, and reflects what is called a K-shaped economy, with higher earners spending and lower earners not.",chinese:"深入分析这一数据可以发现，该指数甚至低于 2008 年大衰退最严重时的水平，反映出所谓的“K型经济”特征——高收入群体仍在消费，而低收入群体则不敢消费。"}],vocabulary:[{word:"buffeted",variants:["buffet","buffets","buffeting"],phonetic:"/ˈbʌf.ɪ.tɪd/",partOfSpeech:"v.",definition:"subjected to repeated damage, difficulty, or difficulty",chinese:"受冲击，遭连续打击",example:"The state has been buffeted by a litany of layoffs this year.",exampleChinese:"今年以来加州遭受了一连串裁员风暴的冲击。"},{word:"litany",variants:["litanies"],phonetic:"/ˈlɪt.ən.i/",partOfSpeech:"n.",definition:"a long, repetitive, or tedious series or list of things",chinese:"一连串，长串（坏事/不愉快事件）",example:"Buffeted by a litany of layoffs this year.",exampleChinese:"遭受了一连串裁员风暴的冲击。"},{word:"contraction",variants:["contractions","contract"],phonetic:"/kənˈtræk.ʃən/",partOfSpeech:"n.",definition:"the process of becoming smaller or shrinking in economic activity",chinese:"（经济/产业）萎缩，收缩",example:"Including contraction in the entertainment industry.",exampleChinese:"包括娱乐产业的萎缩。"},{word:"hunkering",variants:["hunker","hunkers","hunkered"],phonetic:"/ˈhʌŋ.kə.rɪŋ/",partOfSpeech:"v.",definition:"hunker down: to prepare oneself to stay in a safe place during a difficult period",chinese:"收缩开支，观望防御",example:"People are hunkering down because they think a storm is coming.",exampleChinese:"人们正在收缩开支、观望防御，因为他们觉得风暴将至。"},{word:"reminiscent",phonetic:"/ˌrem.ɪˈnɪs.ənt/",partOfSpeech:"adj.",definition:"tending to remind one of something or suggesting the memory of",chinese:"令人想起...的，似曾相识的",example:"Reminiscent of the buildup to the last tech bust.",exampleChinese:"让人不禁联想起上一轮科技泡沫破裂前的狂热蓄势。"},{word:"consolidation",variants:["consolidations","consolidate"],phonetic:"/kənˌsɒl.ɪˈdeɪ.ʃən/",partOfSpeech:"n.",definition:"the joining of two or more businesses into a larger whole",chinese:"兼并，行业整合",example:"Before the current wave of consolidations that is threatening more job losses.",exampleChinese:"发生在当前可能引发更多失业的行业整合浪潮之前。"},{word:"whipsawed",variants:["whipsaw","whipsaws","whipsawing"],phonetic:"/ˈwɪp.sɔːd/",partOfSpeech:"v.",definition:"subjected to two opposing forces or rapid fluctuations at once",chinese:"使两头受挫，剧烈折磨",example:"Erratic tariff and immigration policies that have whipsawed industries.",exampleChinese:"反复无常的关税和移民政策令各大行业饱受折磨。"},{word:"recession",variants:["recessions"],phonetic:"/rɪˈseʃ.ən/",partOfSpeech:"n.",definition:"a period of temporary economic decline during which trade and industrial activity are reduced",chinese:"（经济）衰退，不景气",example:"Consensus that the local economies are heading into a recession.",exampleChinese:"对于经济是否正在走向衰退达成共识。"},{word:"volatile",phonetic:"/ˈvɒl.ə.taɪl/",partOfSpeech:"adj.",definition:"liable to change rapidly and unpredictably, especially for the worse",chinese:"动荡不安的，反复无常的",example:"The volatile market was calmed last week.",exampleChinese:"动荡不安的市场在上周得以平复。"},{word:"perspective",variants:["perspectives"],phonetic:"/pəˈspek.tɪv/",partOfSpeech:"n.",definition:"put into perspective: to assess something in a balanced and realistic context",chinese:"正确客观地看待，全面透视",example:"To put the statistic into perspective, the index is lower than in 2008.",exampleChinese:"深入客观透视这一数据，该指数甚至低于 2008 年。"}],phrases:[{phrase:"fire on all cylinders",chinese:"全速运转，马力全开",example:"The engines that drive it haven't been firing on all cylinders."},{phrase:"put on edge",chinese:"使人人自危，令人紧张不安",example:"The cost-cutting that has put workers on edge."},{phrase:"hunker down",chinese:"潜伏筑防，收缩防御以应对困境",example:"People are hunkering down because they think a storm is coming."},{phrase:"take a toll",chinese:"造成损失，让...大伤元气",example:"A succession of challenges has taken a toll."},{phrase:"put into perspective",chinese:"客观透视，置于全局背景中考察",example:"To put the statistic into perspective, the index is lower..."}],grammarNotes:[{sentence:"Through October, there were 158,734 layoffs announced in California, compared with 136,661 for the same period last year. That was the most of any state, lagging behind only Washington, D.C., which has been hit hard by federal downsizing...",explanation:"第一句为 there be 句型，分词短语 'announced in California' 作后置定语修饰 'layoffs'，'compared with...' 为过去分词短语作状语。第二句主干为 'That was the most'，'lagging behind...' 为现在分词短语作结果状语，其中 'which has been hit...' 为非限制性定语从句修饰 'Washington, D.C.'。"},{sentence:"The mood is glum as well in Hollywood, where a succession of challenges including the dual writers' and actors' strikes in 2023 and runaway production to other locales has taken a toll - and that was before the current wave of consolidations that is threatening more job losses...",explanation:"主干是 'The mood is glum'。'where...' 引导非限制性定语从句修饰 'Hollywood'，从句主语为 'a succession of challenges'，谓语是 'has taken a toll'；破折号后 'that was before...' 补充说明时间，后跟定语从句 'that is threatening...' 修饰 'wave of consolidations'。"},{sentence:"Yet for all the doom and gloom, there isn't any consensus that the local, state or national economies are heading into a recession, even with the federal administration's erratic tariff and immigration policies that have whipsawed industries...",explanation:"句首 'for all...' 意为“尽管/虽然”，作让步状语；主干为 'there isn't any consensus'，'that...' 引导同位语从句解释说明 'consensus' 的内容；'even with...' 介词短语表示伴随/让步，末尾定语从句 'that have whipsawed...' 修饰 'policies'。"}],quiz:[{question:"According to Paragraph 2 and 9, what primary factors are driving the layoff wave in California?",options:["Natural disasters and the total collapse of local agriculture.","Entertainment contraction, AI job replacement, and macroeconomic uncertainties.","Strict federal environmental regulations on Silicon Valley tech firms.","Mass migration of tech workers from Washington, D.C. to Hollywood."],correctAnswer:1,explanation:"Paragraph 2 explicitly lists 'contraction in the entertainment industry, displacements caused by artificial intelligence and overall uncertainty in the national economy' as key reasons for California's layoffs."},{question:"What does the author imply about AI's role in the current U.S. economy?",options:["AI has completely eliminated the threat of inflation nationwide.","AI spending is driving economic growth while simultaneously replacing entry-level jobs and fueling stock bubble fears.","AI investment has dropped significantly since the tech bust of the late 1990s.","AI has only impacted high-level executive positions in tech companies."],correctAnswer:1,explanation:"The article shows a dual impact: AI replaces entry-level jobs (P8, P9) while massive capital spending in AI drives GDP growth and keeps the economy out of recession (P18-P20), while fueling stock bubble fears (P21)."},{question:"What does the term 'K-shaped economy' in Paragraph 24 refer to?",options:["An economy where both tech and entertainment sectors grow at equal speed.","A market structure where inflation and unemployment fall simultaneously.","An economic divergence where higher-income earners continue spending while middle/lower-income workers cut back.","A system where government spending exceeds private investment by a wide margin."],correctAnswer:2,explanation:"Paragraph 24 explains the K-shaped economy as one 'with higher earners spending and lower earners not'."}]},Zp={id:"2026-07-26",date:"2026-07-26",title:"Bees, Like Humans, Can Preserve Cultural Traditions",difficulty:"Advanced (The Economist)",wordCount:706,topic:"Nature & Science",summary:"A recent study reveals that stingless bees, much like humans, can pass down distinct architectural styles for building their combs across generations. This challenges the notion that cumulative culture is unique to humans.",paragraphs:[{id:"p1",english:"When it comes to architectural accomplishments, humans like to think they stand at the top of the pyramid. That is to underestimate the astonishing achievements of social insects: termites raise skyscraping nests and honeybees fashion mesmerisingly geometric combs.",chinese:"提到建筑成就，人类总喜欢自认处于金字塔的顶端。但这却低估了社会性昆虫的惊人成就：白蚁能筑起摩天大楼般的蚁巢，蜜蜂也能造出令人着迷的几何状蜂巢。"},{id:"p2",english:"The true master builders of the insect world, however, are the hundreds of species of stingless bee, native to the tropics and subtropics, which weave combs of unparalleled variety and intricacy inside hollow tree trunks or other cavities.",chinese:"然而，昆虫世界真正的建筑大师是数百种无刺蜂，它们原产于热带和亚热带地区，能在空心树干或其他洞穴中编织出种类繁多、错综复杂的蜂巢。"},{id:"p3",english:"Now a group of evolutionary biologists led by Viviana Di Pietro at ku Leuven, in Belgium, reports that, like humans, these tiny-brained creatures are capable of building according to different architectural traditions which are then handed down over generations.",chinese:"如今，由比利时鲁汶大学的维维安娜·迪·皮特罗领导的一组进化生物学家报告称，就像人类一样，这些大脑微小的生物能够根据不同的建筑传统进行建造，并将这些传统代代相传。"},{id:"p4",english:"The finding is the clearest demonstration yet of cultural differences spontaneously appearing in insects.",chinese:"这一发现是迄今为止关于昆虫自发出现文化差异的最清晰证明。"},{id:"p5",english:'The notion of insect culture would once have been thought impossible, says behavioural biologist Andrew Whiten of the University of St Andrews, who was not involved in the research. "Less than a century ago, culture was thought to be uniquely human."',chinese:"圣安德鲁斯大学的行为生物学家安德鲁·惠顿并未参与此项研究，他表示，昆虫存在文化的概念曾经被认为是不可能的。“不到一个世纪前，人们还认为文化是人类独有的。”"},{id:"p6",english:"To collect their data, Ms Di Pietro and her colleagues observed more than 400 colonies of the stingless bee species Scaptotrigona depilis in a large apiary in Brazil over two extended periods in 2022 and 2023.",chinese:"为了收集数据，迪·皮特罗女士及其同事在2022年和2023年的两个漫长时期里，对巴西一个大型养蜂场中的400多个无刺蜂（Scaptotrigona depilis）蜂群进行了观察。"},{id:"p7",english:"Around 95% of the colonies exhibited combs built up in horizontal layers, like tiered wedding cakes, while the remainder adopted a spiral structure. In each case the tradition was maintained over many generations of worker bees.",chinese:"大约95%的蜂群所建造的蜂巢呈水平分层状，就像多层婚礼蛋糕，而其余的则采用了螺旋结构。在每种情况下，这种传统都在多代工蜂中得以保持。"},{id:"p8",english:"Since S. depilis shows a strong preference for a horizontal-layer comb structure, it is surprising that spiral combs occur at all. Capturing the insects' behaviour on video, the team established that there was no difference in average cell-building rate between the two styles, and hence no efficiency advantage to either.",chinese:"既然该无刺蜂对水平分层的蜂巢结构表现出强烈的偏好，那么螺旋形蜂巢的出现就令人惊讶了。通过将这些昆虫的行为录制成视频，研究小组确认，这两种风格在平均建造蜂房的速度上没有差异，因此两者都不存在效率优势。"},{id:"p9",english:"In order to rule out a genetic explanation for the different styles, the researchers transplanted workers from colonies that built in one tradition to colonies that built in the other, having first emptied the host structures of their indigenous adults.",chinese:"为了排除不同风格是由基因造成的这一解释，研究人员将原本按照一种传统筑巢的工蜂移植到按照另一种传统筑巢的蜂群中，在移植前，他们先清空了目标蜂巢中原本的成年蜜蜂。"},{id:"p10",english:"The imported workers soon switched to the local style, which was then perpetuated by the colony's own larvae as they eventually matured into workers.",chinese:"迁入的工蜂很快就转而采用了当地的风格，随后，该蜂群自身的幼虫在最终长成工蜂后，也将这种风格延续了下去。"},{id:"p11",english:"Tom Wenseleers, who runs the lab in which Ms Di Pietro is a doctoral student, hypothesised that the bees may switch styles as a way of coping with the build-up of minuscule construction errors made by their predecessors. Such a process, in which multiple organisms indirectly affect each other's behaviour through the traces they leave on their environment, is known as stigmergy.",chinese:"汤姆·温塞勒斯管理着迪·皮特罗女士攻读博士学位的实验室，他假设蜜蜂改变风格可能是为了应对前辈们累积的微小建筑误差。这种多个生物通过在环境中留下的痕迹来间接影响彼此行为的过程，被称为“共识主动性”（stigmergy）。"},{id:"p12",english:"To test whether stigmergy was in fact responsible for the stylistic schism between bee colonies, the researchers introduced a hint of helicity to otherwise perfect horizontal-layer combs, and found that it did indeed prompt the bees to switch to building spirals. That is strong evidence in favour of Dr Wenseleers's hypothesis.",chinese:"为了测试“共识主动性”是否真的是导致蜂群间风格分化的原因，研究人员在原本完美的水平分层蜂巢中引入了一点螺旋的迹象，结果发现这确实促使蜜蜂转而建造螺旋蜂巢。这是支持温塞勒斯博士假设的有力证据。"},{id:"p13",english:"These results have left observers of animal culture abuzz, as they suggest that stingless bees can transmit different building traditions across generations without individuals needing to be instructed by their peers.",chinese:"这些结果让动物文化的观察者们议论纷纷，因为它们表明，无刺蜂可以在不需要个体接受同伴指导的情况下，将不同的建筑传统代代相传。"},{id:"p14",english:"This is a more expansive way of thinking about culture, which is often rigidly defined as behaviour directly transmitted from individual to individual until it becomes characteristic of a group.",chinese:"这是一种更为广义的文化认知方式。人们通常将文化严格定义为：从一个个体直接传递给另一个个体的行为，直到它成为一个群体的特征。"},{id:"p15",english:"For Dr Whiten, the new finding indicates that more complex animal behaviours — the building of dams by beavers or nests by chimpanzees, for instance — may also have arisen through such indirect transmission.",chinese:"对于惠顿博士来说，这一新发现表明，更复杂的动物行为——例如海狸筑坝或黑猩猩筑巢——也可能是通过这种间接传播方式产生的。"},{id:"p16",english:"Though it is too early to know for certain, say scientists, it is possible that some human traditions could have stigmergic roots too.",chinese:"科学家们表示，尽管现在下定论还为时过早，但一些人类传统也有可能源于“共识主动性”。"},{id:"p17",english:"Bees may not be done confounding expectations. In recent laboratory experiments with bumblebees, Lars Chittka, a behavioural ecologist at Queen Mary, University of London, found that they were capable of learning cumulatively — that is, adopting and expanding upon the innovations of previous generations.",chinese:"蜜蜂可能还会继续打破人们的预期。在最近对熊蜂进行的实验室实验中，伦敦玛丽女王大学的行为生态学家拉尔斯·奇特卡发现，它们具备累积学习的能力——也就是说，能够采用并扩展前几代的创新。"},{id:"p18",english:'The team trained "demonstrator bees" to open a complicated two-step puzzle box (in which blue and red tabs had to be pushed out of the way to reveal a solution of sucrose), and then observed other insects learning the right technique from the demonstrators.',chinese:"该团队训练“演示蜂”打开一个复杂的两步拼图盒（其中必须推开蓝色和红色标签才能露出蔗糖溶液），然后观察其他昆虫从“演示蜂”那里学习正确的技术。"},{id:"p19",english:"Such cumulative culture, which does require social learning, was previously thought to be unique to humans. It may be long past time to make room at the top of that pyramid.",chinese:"这种确实需要社会学习的累积文化，以前被认为是人类所独有的。现在早该在那个金字塔的顶端为它们腾出一些空间了。"}],vocabulary:[{word:"underestimate",variants:["underestimates","underestimated","underestimating"],phonetic:"/ˌʌndərˈestɪmeɪt/",partOfSpeech:"v.",definition:"to fail to guess or understand the real cost, size, difficulty, etc. of something",chinese:"低估",example:"That is to underestimate the astonishing achievements of social insects.",exampleChinese:"但这却低估了社会性昆虫的惊人成就。"},{word:"fashion",variants:["fashions","fashioned","fashioning"],phonetic:"/ˈfæʃən/",partOfSpeech:"v.",definition:"to make something using your hands",chinese:"制作，塑造",example:"Honeybees fashion mesmerisingly geometric combs.",exampleChinese:"蜜蜂能造出令人着迷的几何状蜂巢。"},{word:"intricacy",variants:["intricacies"],phonetic:"/ˈɪntrɪkəsi/",partOfSpeech:"n.",definition:"the complicated details of something",chinese:"错综复杂，复杂精细之处",example:"Combs of unparalleled variety and intricacy.",exampleChinese:"种类繁多、错综复杂的蜂巢。"},{word:"spontaneously",phonetic:"/spɒnˈteɪniəsli/",partOfSpeech:"adv.",definition:"in a way that is natural, often sudden, and not planned",chinese:"自发地，自然地",example:"Cultural differences spontaneously appearing in insects.",exampleChinese:"昆虫自发出现文化差异。"},{word:"perpetuated",variants:["perpetuate","perpetuates","perpetuating"],phonetic:"/pəˈpetʃueɪtɪd/",partOfSpeech:"v.",definition:"(past tense of perpetuate) to cause something to continue",chinese:"使延续，使不朽",example:"The style was then perpetuated by the colony's own larvae.",exampleChinese:"这种风格随后被蜂群自身的幼虫延续了下去。"},{word:"stigmergy",variants:["stigmergic"],phonetic:"/ˈstɪɡmərdʒi/",partOfSpeech:"n.",definition:"a mechanism of indirect coordination through the environment",chinese:"共识主动性 / 痕迹导引",example:"Such a process is known as stigmergy.",exampleChinese:"这种过程被称为“共识主动性”。"},{word:"schism",variants:["schisms"],phonetic:"/ˈsɪzəm, ˈskɪz-/",partOfSpeech:"n.",definition:"a division into two groups caused by a disagreement about ideas",chinese:"分裂，分化",example:"The stylistic schism between bee colonies.",exampleChinese:"蜂群间风格的分化。"},{word:"abuzz",phonetic:"/əˈbʌz/",partOfSpeech:"adj.",definition:"filled with a continuous humming sound or filled with excitement and activity",chinese:"议论纷纷，嘈杂的",example:"These results have left observers of animal culture abuzz.",exampleChinese:"这些结果让动物文化的观察者们议论纷纷。"},{word:"confounding",variants:["confound","confounds","confounded"],phonetic:"/kənˈfaʊndɪŋ/",partOfSpeech:"v.",definition:"(present participle of confound) to confuse and very much surprise someone",chinese:"使困惑，打破（预期）",example:"Bees may not be done confounding expectations.",exampleChinese:"蜜蜂可能还会继续打破人们的预期。"},{word:"cumulatively",variants:["cumulative"],phonetic:"/ˈkjuːmjələtɪvli/",partOfSpeech:"adv.",definition:"in a way that increases by one addition after another",chinese:"累积地",example:"They were capable of learning cumulatively.",exampleChinese:"它们具备累积学习的能力。"}],phrases:[{phrase:"when it comes to",chinese:"提到，当谈及...时",example:"When it comes to architectural accomplishments..."},{phrase:"stand at the top of the pyramid",chinese:"处于金字塔顶端（占据统治或最高地位）",example:"Humans like to think they stand at the top of the pyramid."},{phrase:"rule out",chinese:"排除（可能性等）",example:"In order to rule out a genetic explanation..."},{phrase:"cope with",chinese:"应对，处理",example:"Switch styles as a way of coping with the build-up of errors."},{phrase:"long past time",chinese:"早该...了",example:"It may be long past time to make room at the top of that pyramid."}],grammarNotes:[{sentence:"That is to underestimate the astonishing achievements of social insects: termites raise skyscraping nests and honeybees fashion mesmerisingly geometric combs.",explanation:"冒号后的句子用于解释说明前面的 'astonishing achievements'。其中 'fashion' 并非名词“时尚”，而是动词，意为“制作、塑造”。原PDF中的“几何梳子”是机器直翻的错误，combs在这里特指“蜂巢”。"},{sentence:"Such a process, in which multiple organisms indirectly affect each other's behaviour through the traces they leave on their environment, is known as stigmergy.",explanation:"主干是 'Such a process is known as stigmergy'。'in which...' 是一个非限制性定语从句，修饰 'process'，解释了这个过程的具体机制。原PDF将其错误翻译为“污名化”（stigma），实际上这是一个专业的生物学名词“共识主动性”。"},{sentence:"To test whether stigmergy was in fact responsible for the stylistic schism between bee colonies, the researchers introduced a hint of helicity to otherwise perfect horizontal-layer combs...",explanation:"这里 'responsible for' 意为“是...的原因”。'otherwise' 意为“在其他方面（如果没有这个螺旋迹象的话）”，'otherwise perfect' 表示原本完美的水平蜂巢。"}],quiz:[{question:"According to the article, what defines 'stigmergy'?",options:["Bees directly instructing each other on how to build.","A genetic trait that dictates comb structure.","Organisms indirectly affecting each other's behavior through traces left in the environment.","A cultural difference that spontaneously appears."],correctAnswer:2,explanation:"Paragraph 11 explicitly defines stigmergy as a process 'in which multiple organisms indirectly affect each other's behaviour through the traces they leave on their environment'."},{question:"Why did researchers transplant bees into empty host structures in Paragraph 9?",options:["To see if they would fight with the indigenous adults.","To rule out a genetic explanation for the different building styles.","To test if they could survive outside their native environment.","To observe how quickly they could build a new comb from scratch."],correctAnswer:1,explanation:"Paragraph 9 starts with: 'In order to rule out a genetic explanation for the different styles, the researchers transplanted workers...'"},{question:"What did Lars Chittka's experiment with bumblebees demonstrate?",options:["That they cannot learn complicated tasks.","That they prefer horizontal combs over spiral ones.","That they are capable of cumulative learning by observing demonstrators.","That they communicate primarily through pheromones."],correctAnswer:2,explanation:"Paragraph 17-18 show that bumblebees are capable of learning cumulatively by observing 'demonstrator bees' open a puzzle box."}]},ja=[Qp,Xp,Zp],Xi={accomplishment:{word:"accompl
